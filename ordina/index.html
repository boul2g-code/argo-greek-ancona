<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ordina | ARGO Greek Comfort Food</title><meta name="theme-color" content="#0D3B66"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1724;color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900}.logo b{color:#d9c7a3}.back{color:#d9c7a3;text-decoration:none}.hero{padding:30px 0 18px}h1{font-size:42px;margin:0 0 8px}.muted{color:#aab5c2}.cats{display:flex;gap:7px;overflow:auto;padding:8px 0 16px}.chip{white-space:nowrap;border:1px solid #34485d;background:#14283b;color:#fff;border-radius:20px;padding:8px 13px}.chip.on{background:#d9c7a3;color:#0d3b66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.item{background:#122638;border:1px solid #263c50;border-radius:14px;padding:14px}.item h3{margin:0 0 6px}.desc{font-size:12px;color:#9cabb9;min-height:30px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.price{font-weight:900;color:#d9c7a3}.add{border:0;border-radius:9px;background:#1d70ff;color:white;padding:9px 13px;font-weight:800}.cart{position:sticky;bottom:10px;margin-top:18px;background:#fff;color:#132238;border-radius:16px;padding:14px;box-shadow:0 8px 30px #0008}.carthead{display:flex;justify-content:space-between;align-items:center}.cartlines{font-size:13px;margin:8px 0;max-height:160px;overflow:auto}.line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee}.checkout{width:100%;border:0;border-radius:10px;background:#0d3b66;color:#fff;padding:13px;font-size:16px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:18px;overflow:auto}.modal.on{display:block}.box{max-width:520px;margin:30px auto;background:#fff;color:#132238;border-radius:18px;padding:22px}input,select,textarea{width:100%;padding:12px;margin:6px 0 11px;border:1px solid #ccd4dc;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ok{background:#e9fff0;border:1px solid #b7e8c4;padding:16px;border-radius:12px}.close{float:right;border:0;background:none;font-size:22px}@media(max-width:600px){h1{font-size:34px}.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div class="logo">ARGO <b>Greek</b></div><a class="back" href="../">← Sito</a></div><div class="hero"><h1>Ordina direttamente da ARGO</h1><div class="muted">Scegli, invia l'ordine e ritira al locale. Nessuna piattaforma in mezzo.</div></div><div id="cats" class="cats"></div><div id="menu" class="grid"></div><div class="cart"><div class="carthead"><b>🛒 Il tuo ordine</b><strong id="total">€ 0,00</strong></div><div id="lines" class="cartlines"><span class="muted">Il carrello è vuoto</span></div><button id="checkout" class="checkout" disabled>CONTINUA</button></div></div><div id="modal" class="modal"><div class="box"><button class="close" onclick="modal.classList.remove('on')">×</button><h2>Completa l'ordine</h2><div id="form"><label>Nome *</label><input id="name"><label>Telefono *</label><input id="phone" inputmode="tel"><label>Email</label><input id="email" type="email"><div class="row"><div><label>Tipo</label><select id="type"><option value="asporto">Asporto</option><option value="delivery">Delivery</option></select></div><div><label>Pagamento</label><select id="pay"><option value="pay_at_store">Al ritiro</option><option value="cash">Contanti</option></select></div></div><div id="addressWrap" style="display:none"><label>Indirizzo</label><input id="address"></div><label>Ora desiderata</label><input id="when" type="datetime-local"><label>Note</label><textarea id="notes" rows="3"></textarea><button id="send" class="checkout">INVIA ORDINE</button><p id="err" style="color:#b91c1c"></p></div><div id="success" style="display:none"></div></div></div><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');let items=[],cats=[],cart={};const euro=n=>'€ '+Number(n).toFixed(2).replace('.',',');async function load(){let c=await sb.from('argo_menu_categories').select('*').eq('active',true).order('sort_order'),m=await sb.from('argo_menu_items').select('*').eq('active',true).order('sort_order');cats=c.data||[];items=m.data||[];renderCats();render()}function renderCats(){catsEl=document.getElementById('cats');catsEl.innerHTML='<button class="chip on" data-id="all">Tutto</button>'+cats.map(c=>`<button class="chip" data-id="${c.id}">${c.name}</button>`).join('');catsEl.onclick=e=>{if(!e.target.dataset.id)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');render(e.target.dataset.id)}}function render(cat='all'){document.getElementById('menu').innerHTML=items.filter(x=>cat==='all'||x.category_id===cat).map(x=>`<div class="item"><h3>${x.name}</h3><div class="desc">${x.description||''}</div><div class="foot"><span class="price">${euro(x.price)}</span><button class="add" onclick="add('${x.id}')">+ AGGIUNGI</button></div></div>`).join('')}function add(id){cart[id]=(cart[id]||0)+1;drawCart()}function drawCart(){let rows=Object.entries(cart).filter(([,q])=>q>0),tot=0;document.getElementById('lines').innerHTML=rows.length?rows.map(([id,q])=>{let x=items.find(i=>i.id===id);tot+=Number(x.price)*q;return `<div class="line"><span>${q}× ${x.name}</span><span>${euro(Number(x.price)*q)} <button onclick="cart['${id}']--;drawCart()">−</button></span></div>`}).join(''):'<span class="muted">Il carrello è vuoto</span>';document.getElementById('total').textContent=euro(tot);checkout.disabled=!rows.length}checkout.onclick=()=>modal.classList.add('on');type.onchange=()=>addressWrap.style.display=type.value==='delivery'?'block':'none';send.onclick=async()=>{err.textContent='';if(!name.value.trim()||!phone.value.trim()){err.textContent='Nome e telefono sono obbligatori.';return}send.disabled=true;send.textContent='INVIO…';let pitems=Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({menu_item_id:id,quantity:q}));let {data,error}=await sb.rpc('argo_place_order',{p_customer_name:name.value,p_phone:phone.value,p_email:email.value,p_order_type:type.value,p_requested_at:when.value?new Date(when.value).toISOString():null,p_address:address.value,p_notes:notes.value,p_payment_method:pay.value,p_items:pitems});send.disabled=false;send.textContent='INVIA ORDINE';if(error){err.textContent='Errore invio ordine. Riprova o chiamaci.';return}form.style.display='none';success.style.display='block';success.innerHTML=`<div class="ok"><h2>✓ Ordine #${data.order_number} ricevuto</h2><p>Totale <b>${euro(data.total)}</b></p><p>Attendi la conferma del locale.</p></div>`;cart={};drawCart()};load()</script></body></html>
