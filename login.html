<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARGO Admin — Accesso</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0d3b66,#2456a4);min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:#fff;width:min(420px,100%);padding:38px;border-radius:20px;box-shadow:0 20px 60px #0005}h1{color:#0d3b66;margin:0 0 8px}.sub{color:#667085;margin-bottom:26px}.field{margin:14px 0}label{display:block;font-weight:700;color:#344054;margin-bottom:6px}input{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#0d3b66;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:10px;border-radius:8px;display:none}.err{display:block;background:#fef3f2;color:#b42318}.ok{display:block;background:#ecfdf3;color:#067647}.back{display:block;text-align:center;margin-top:18px;color:#667085;text-decoration:none}</style>
</head><body><div class="box"><h1>ARGO ADMIN</h1><div class="sub">Accesso amministratore</div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" value="boul2g@gmail.com" readonly></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit">Entra</button></form><div id="msg" class="msg"></div><a class="back" href="./">← Torna al sito</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');
const msg=document.getElementById('msg');
document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();msg.className='msg ok';msg.textContent='Accesso…';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await sb.rpc('argo_admin_login',{p_email:email,p_password:password});if(error||!data){msg.className='msg err';msg.textContent='Email o password non validi.';return}localStorage.setItem('argo_admin_token_v1',data);sessionStorage.setItem('admin_auth',Date.now()+8*3600000);window.location.href='./admin.html';});
</script></body></html>
