<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin · Menu</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:#fff;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:#fff;color:#0d3b66}.wrap{max-width:1150px;margin:auto;padding:14px}.head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tools{display:flex;gap:8px;flex-wrap:wrap}.search,.select{padding:10px 12px;border:1px solid #ccd5df;border-radius:9px;background:#fff}.search{width:min(320px,100%)}.status{font-size:13px;color:#64748b;margin:8px 0 12px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{border:0;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer;background:#dbeafe;color:#164e9b}.pill.on{background:#0d3b66;color:#fff}.section{background:#fff;border:1px solid #dbe2e8;border-radius:14px;margin:0 0 12px;overflow:hidden}.section h3{margin:0;padding:12px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb}.row{display:grid;grid-template-columns:1fr 90px 190px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.name{font-weight:900}.meta{font-size:12px;color:#64748b;margin-top:3px}.price{font-weight:900}.actions{display:flex;gap:6px}.btn{border:0;border-radius:9px;padding:9px 10px;font-weight:800;cursor:pointer}.activebtn{background:#dcfce7;color:#166534}.offbtn{background:#fee2e2;color:#991b1b}.edit{background:#dbeafe;color:#164e9b}.empty,.err{padding:35px;text-align:center;color:#64748b}.err{color:#991b1b;background:#fff1f2;border-radius:10px}dialog{border:0;border-radius:16px;padding:0;max-width:430px;width:calc(100% - 30px)}.modal{padding:20px}.modal input{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:8px;margin:6px 0 12px}.modalmenu{display:flex;gap:8px;justify-content:flex-end}@media(max-width:650px){.row{grid-template-columns:1fr 75px}.actions{grid-column:1/-1}.price{text-align:right}.tools{width:100%}.search,.select{width:100%}}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a class="active" href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><div class="head"><h2>Menu completo</h2><div class="tools"><input id="q" class="search" placeholder="Cerca prodotto"><select id="catFilter" class="select"><option value="all">Tutte le categorie</option></select></div></div><div class="summary"><button class="pill on" data-mode="all">TUTTI</button><button class="pill" data-mode="active">ATTIVI</button><button class="pill" data-mode="off">DISATTIVATI</button></div><div id="status" class="status">Caricamento menu…</div><div id="list"><div class="empty">Caricamento…</div></div></main><dialog id="dlg"><div class="modal"><h3>Modifica prodotto</h3><input id="ename" placeholder="Nome"><input id="eprice" type="number" step="0.01" placeholder="Prezzo"><input id="eimage" placeholder="URL immagine"><div class="modalmenu"><button class="btn" onclick="dlg.close()">Annulla</button><button class="btn edit" id="save">Salva</button></div></div></dialog><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');let items=[],cats={},editing=null,mode='all';const euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',',');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function valid(){const {data,error}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(error||!data){location.href='./';return false}return true}async function load(){status.textContent='Caricamento menu completo…';const [m,c]=await Promise.all([sb.rpc('argo_admin_menu',{p_token:tok()}),sb.rpc('argo_admin_categories',{p_token:tok()})]);if(m.error||c.error){list.innerHTML='<div class="err">Errore caricamento menu: '+esc(m.error?.message||c.error?.message||'errore sconosciuto')+'</div>';status.textContent='Menu non caricato';return}items=m.data||[];cats={};(c.data||[]).forEach(x=>cats[x.id]=x.name);catFilter.innerHTML='<option value="all">Tutte le categorie</option>'+Object.entries(cats).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');status.textContent=`${items.length} prodotti totali · ${items.filter(x=>x.active).length} attivi · ${items.filter(x=>!x.active).length} disattivati`;render()}function render(){const s=q.value.trim().toLowerCase(),cf=catFilter.value;let a=items.filter(x=>(mode==='all'||(mode==='active'&&x.active)||(mode==='off'&&!x.active))&&(cf==='all'||x.category_id===cf)&&(!s||String(x.name).toLowerCase().includes(s)||String(cats[x.category_id]||'').toLowerCase().includes(s)));if(!a.length){list.innerHTML='<div class="section"><div class="empty">Nessun prodotto</div></div>';return}const grouped={};for(const x of a){const cn=cats[x.category_id]||'Senza categoria';(grouped[cn]??=[]).push(x)}list.innerHTML=Object.entries(grouped).map(([cn,arr])=>`<section class="section"><h3>${esc(cn)} · ${arr.length}</h3>${arr.map(x=>`<div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">${x.active?'Visibile nel menu pubblico':'Archivio / non visibile'}</div></div><div class="price">${euro(x.price)}</div><div class="actions"><button class="btn ${x.active?'activebtn':'offbtn'}" onclick="toggleItem('${x.id}')">${x.active?'ATTIVO':'OFF'}</button><button class="btn edit" onclick="openEdit('${x.id}')">MODIFICA</button></div></div>`).join('')}</section>`).join('')}async function toggleItem(id){const x=items.find(i=>i.id===id);if(!x)return;const {error}=await sb.rpc('argo_admin_update_item',{p_token:tok(),p_id:id,p_name:x.name,p_price:x.price,p_image_url:x.image_url||'',p_active:!x.active});if(error)return alert('Errore: '+error.message);await load()}function openEdit(id){editing=items.find(i=>i.id===id);if(!editing)return;ename.value=editing.name;eprice.value=editing.price;eimage.value=editing.image_url||'';dlg.showModal()}save.onclick=async()=>{if(!editing)return;const {error}=await sb.rpc('argo_admin_update_item',{p_token:tok(),p_id:editing.id,p_name:ename.value.trim(),p_price:Number(eprice.value),p_image_url:eimage.value.trim(),p_active:editing.active});if(error)return alert('Errore: '+error.message);dlg.close();await load()};document.querySelector('.summary').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));render()};q.oninput=render;catFilter.onchange=render;valid().then(ok=>ok&&load());</script></body></html>
