<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Menu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:white;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:white;color:#0d3b66}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:white;border:1px solid #dbe2e8;border-radius:14px;padding:14px}.row{display:grid;grid-template-columns:1fr 110px 110px 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.name{font-weight:900}.cat{font-size:12px;color:#64748b}.price{font-weight:900}.btn{border:0;border-radius:9px;padding:9px 10px;font-weight:800}.on{background:#dcfce7;color:#166534}.off{background:#fee2e2;color:#991b1b}.edit{background:#dbeafe;color:#164e9b}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.search{width:100%;max-width:360px;padding:10px 12px;border:1px solid #ccd5df;border-radius:9px}.empty{padding:30px;text-align:center;color:#64748b}@media(max-width:650px){.row{grid-template-columns:1fr 75px}.row .cat{grid-column:1}.row .actions{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:6px}.price{grid-column:1}}dialog{border:0;border-radius:16px;padding:0;max-width:430px;width:calc(100% - 30px)}.modal{padding:20px}.modal input{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:8px;margin:6px 0 12px}.modalmenu{display:flex;gap:8px;justify-content:flex-end}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a class="active" href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><div class="head"><h2>Menu</h2><input id="q" class="search" placeholder="Cerca prodotto"></div><div id="list" class="card"></div></main><dialog id="dlg"><div class="modal"><h3>Modifica prodotto</h3><input id="ename" placeholder="Nome"><input id="eprice" type="number" step="0.01" placeholder="Prezzo"><input id="eimage" placeholder="URL immagine"><div class="modalmenu"><button class="btn" onclick="dlg.close()">Annulla</button><button class="btn edit" id="save">Salva</button></div></div></dialog><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');let items=[],cats={},editing=null;const euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',',');async function valid(){let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data)location.href='./'}async function load(){let [{data:m},{data:c}]=await Promise.all([sb.rpc('argo_admin_menu',{p_token:tok()}),sb.rpc('argo_admin_categories',{p_token:tok()})]);items=m||[];(c||[]).forEach(x=>cats[x.id]=x.name);render()}function render(){let s=q.value.toLowerCase();let a=items.filter(x=>!s||x.name.toLowerCase().includes(s));list.innerHTML=a.length?a.map(x=>`<div class="row"><div><div class="name">${x.name}</div><div class="cat">${cats[x.category_id]||''}</div></div><div class="price">${euro(x.price)}</div><div class="actions"><button class="btn ${x.active?'on':'off'}" onclick="toggle('${x.id}')">${x.active?'ATTIVO':'OFF'}</button><button class="btn edit" onclick="openEdit('${x.id}')">MODIFICA</button></div></div>`).join(''):'<div class="empty">Nessun prodotto</div>'}async function toggle(id){let x=items.find(i=>i.id===id);let {error}=await sb.rpc('argo_admin_update_item',{p_token:tok(),p_id:id,p_name:x.name,p_price:x.price,p_image_url:x.image_url||'',p_active:!x.active});if(error)return alert(error.message);await load()}function openEdit(id){editing=items.find(i=>i.id===id);ename.value=editing.name;eprice.value=editing.price;eimage.value=editing.image_url||'';dlg.showModal()}save.onclick=async()=>{let {error}=await sb.rpc('argo_admin_update_item',{p_token:tok(),p_id:editing.id,p_name:ename.value.trim(),p_price:Number(eprice.value),p_image_url:eimage.value.trim(),p_active:editing.active});if(error)return alert(error.message);dlg.close();await load()};q.oninput=render;valid().then(load)</script></body></html>
