<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Terminal</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;z-index:5;background:#081d33;color:#fff;padding:12px;display:flex;justify-content:space-between;gap:10px}.wrap{padding:10px;max-width:900px;margin:auto}.login{max-width:420px;margin:40px auto;background:#fff;padding:20px;border-radius:14px}.login input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd4dc;border-radius:8px;font-size:16px}.btn{border:0;border-radius:9px;padding:13px 14px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.primary{background:#0d3b66;color:#fff}.print{background:#f59e0b;color:#10263b}.green{background:#dcfce7;color:#166534}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.filter{border:0;border-radius:18px;padding:9px 12px;background:#fff;white-space:nowrap;font-weight:800}.filter.on{background:#0d3b66;color:#fff}.order{background:#fff;border:1px solid #dbe2e8;border-radius:14px;margin-bottom:10px;overflow:hidden}.order.new{border:3px solid #f59e0b}.order.late{border-color:#dc2626}.head{display:flex;justify-content:space-between;align-items:center;padding:11px;background:#f8fafc}.new .head{background:#fff7df}.late .head{background:#fef2f2}.num{font-size:24px;font-weight:900}.pill{font-size:11px;font-weight:900;padding:5px 8px;border-radius:12px;background:#dbeafe}.age{font-size:11px;font-weight:900;margin-left:6px}.age.warn{color:#b45309}.age.late{color:#b91c1c}.body{padding:11px}.customer{font-weight:900}.meta{font-size:12px;color:#617080;margin:4px 0 10px}.line{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eee}.mods{font-size:11px;color:#586779;padding:2px 0 5px 12px;white-space:pre-line}.total{font-size:20px;font-weight:900;text-align:right;padding-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 11px 11px}.actions .main{flex:2;min-width:180px}.actions .secondary{flex:1}.empty{text-align:center;padding:50px;color:#758393}.native{font-size:11px;color:#b9d7f5}.err{color:#b91c1c;font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.sum{background:#fff;border-radius:11px;padding:10px;text-align:center}.sum b{display:block;font-size:24px;color:#0d3b66}.sum span{font-size:10px;font-weight:900;color:#64748b}@media(max-width:520px){.summary{grid-template-columns:repeat(3,1fr)}.actions{flex-direction:column}.actions .main,.actions .secondary{width:100%}}</style></head><body><div id="app"></div><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const TOKEN='argo_admin_token_v1';let all=[],filter='open',lastNew='',busy=new Set();const $=id=>document.getElementById(id),euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',','),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nativeAvailable(){return !!window.ArgoNative}function loginView(){app.innerHTML='<div class="top"><b>🇬🇷 ARGO TERMINAL</b><span class="native">SUNMI</span></div><div class="login"><h2>Accesso ARGO</h2><input id="em" type="email" value="boul2g@gmail.com" readonly><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="login()">ENTRA</button><p id="le" class="err"></p></div>'}async function login(){le.textContent='Accesso…';const {data,error}=await sb.rpc('argo_admin_login',{p_email:em.value.trim().toLowerCase(),p_password:pw.value});const token=typeof data==='string'?data:data?.token;if(error||!token){le.textContent='Accesso non riuscito';return}localStorage.setItem(TOKEN,token);start()}async function start(){const tok=localStorage.getItem(TOKEN);if(!tok){loginView();return}const {data}=await sb.rpc('argo_admin_valid',{p_token:tok});if(!data){localStorage.removeItem(TOKEN);loginView();return}app.innerHTML='<div class="top"><b>🍽️ ARGO ORDINI</b><span id="clock" class="native">SUNMI '+(nativeAvailable()?'✓':'WEB')+'</span></div><div class="wrap"><div class="summary"><div class="sum"><b id="nNew">0</b><span>NUOVI</span></div><div class="sum"><b id="nWork">0</b><span>IN LAVORO</span></div><div class="sum"><b id="nReady">0</b><span>PRONTI</span></div></div><div class="filters"><button class="filter on" data-f="open">Aperti</button><button class="filter" data-f="new">Nuovi</button><button class="filter" data-f="accepted">Accettati</button><button class="filter" data-f="preparing">Preparazione</button><button class="filter" data-f="ready">Pronti</button><button class="filter" data-f="all">Tutti</button></div><div id="orders"></div></div>';document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});await load(true);setInterval(()=>load(false),5000);setInterval(tick,1000);tick()}function tick(){if($('clock'))$('clock').textContent='SUNMI '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});if(all.length)render()}async function load(first=false){const {data,error}=await sb.rpc('argo_admin_orders',{p_token:localStorage.getItem(TOKEN)});if(error){if(/token|auth|session|unauthorized/i.test(String(error.message))){localStorage.removeItem(TOKEN);loginView()}return}const newest=(data||[]).find(x=>x.status==='new');if(!first&&newest&&newest.id!==lastNew)notify();lastNew=newest?.id||'';all=data||[];render()}function notify(){try{if(window.ArgoNative)ArgoNative.notifyNewOrder();else navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}function ageMin(o){return Math.max(0,Math.floor((Date.now()-new Date(o.created_at).getTime())/60000))}function ageClass(o){const m=ageMin(o);return m>=30?'late':m>=20?'warn':''}function orderType(o){const v=String(o.order_type||'pickup').toLowerCase();return /deliver|consegna/.test(v)?'CONSEGNA':'RITIRO DAL LOCALE'}function requested(o){return o.requested_at?new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}function modText(i){const m=i.modifiers;if(!m)return'';if(Array.isArray(m))return m.map(x=>typeof x==='string'?x:(x.name||x.label||x.option_name||'')).filter(Boolean).join('\n');if(typeof m==='object')return Object.values(m).map(x=>typeof x==='string'?x:(x?.name||x?.label||x?.option_name||'')).filter(Boolean).join('\n');return String(m)}function nextAction(o){if(o.status==='new')return['accept_print','✓ ACCETTA & STAMPA','print'];if(o.status==='accepted')return['preparing','IN PREPARAZIONE','primary'];if(o.status==='preparing')return['ready','✓ PRONTO','green'];if(o.status==='ready')return['completed','CONSEGNATO','green'];return null}function render(){if(!$('orders'))return;$('nNew').textContent=all.filter(o=>o.status==='new').length;$('nWork').textContent=all.filter(o=>['accepted','preparing'].includes(o.status)).length;$('nReady').textContent=all.filter(o=>o.status==='ready').length;let x=all.filter(o=>filter==='all'||(filter==='open'?!['completed','cancelled'].includes(o.status):o.status===filter));x.sort((a,b)=>{const rank={new:0,accepted:1,preparing:2,ready:3,completed:4,cancelled:5};return (rank[a.status]??9)-(rank[b.status]??9)||new Date(a.created_at)-new Date(b.created_at)});$('orders').innerHTML=x.length?x.map(card).join(''):'<div class="empty">Nessun ordine</div>'}function card(o){const t=new Date(o.created_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),m=ageMin(o),ac=ageClass(o),next=nextAction(o),disabled=busy.has(o.id)?' disabled':'';return `<article class="order ${o.status==='new'?'new ':''}${ac==='late'&&!['completed','cancelled'].includes(o.status)?'late':''}"><div class="head"><span class="num">#${o.order_number}</span><span><span class="pill">${esc(o.status.toUpperCase())} · ${t}</span>${!['completed','cancelled'].includes(o.status)?`<span class="age ${ac}">${m} min</span>`:''}</span></div><div class="body"><div class="customer">${esc(o.customer_name)} · ${esc(o.phone)}</div><div class="meta">${orderType(o)}${requested(o)?' · richiesto '+requested(o):''}${o.address?' · '+esc(o.address):''}</div>${(o.items||[]).map(i=>`<div class="line"><b>${i.quantity}× ${esc(i.name)}</b><span>${euro(i.line_total)}</span></div>${modText(i)?`<div class="mods">${esc(modText(i))}</div>`:''}${i.notes?`<div class="mods">Nota: ${esc(i.notes)}</div>`:''}`).join('')}${o.notes?`<p><b>NOTE:</b> ${esc(o.notes)}</p>`:''}<div class="total">${euro(o.total)}</div></div><div class="actions">${next?`<button class="btn ${next[2]} main"${disabled} onclick="act('${o.id}','${next[0]}')">${next[1]}</button>`:''}${o.status!=='new'&&!['completed','cancelled'].includes(o.status)?`<button class="btn primary secondary"${disabled} onclick="act('${o.id}','reprint')">🖨 RISTAMPA</button>`:''}</div></article>`}async function act(id,a){if(busy.has(id))return;busy.add(id);render();const o=all.find(x=>x.id===id);const {error}=await sb.rpc('argo_admin_order_action',{p_token:localStorage.getItem(TOKEN),p_order_id:id,p_action:a});if(error){busy.delete(id);render();alert('Errore: '+error.message);return}if(a==='accept_print'||a==='reprint')printOrder(o);await load(true);busy.delete(id);render()}function printOrder(o){const lines=['ARGO GREEK COMFORT FOOD','*** ORDINE SITO ***','------------------------------','#'+o.order_number+'  '+orderType(o),new Date(o.created_at).toLocaleString('it-IT'),'------------------------------',o.customer_name,o.phone];if(o.address)lines.push(o.address);if(o.requested_at)lines.push('ORA: '+requested(o));lines.push('------------------------------');(o.items||[]).forEach(i=>{lines.push(i.quantity+' x '+i.name);const m=modText(i);if(m)lines.push(m);if(i.notes)lines.push('Nota: '+i.notes)});lines.push('------------------------------');if(o.notes)lines.push('NOTE: '+o.notes,'------------------------------');if(Number(o.discount_amount)>0)lines.push('SUBTOTALE '+euro(o.subtotal),'SCONTO '+(o.promo_code||'')+': - '+euro(o.discount_amount));lines.push('TOTALE '+euro(o.total),'Pagamento: '+(o.payment_method||'al ritiro'),'','--- ARGO SITO WEB ---','','');const txt=lines.join('\n');try{if(window.ArgoNative)ArgoNative.printTicket(txt);else alert('Apri questa pagina dall’app ARGO SUNMI per stampare.')}catch(e){alert('Errore stampa: '+e.message)}}start()</script></body></html>
