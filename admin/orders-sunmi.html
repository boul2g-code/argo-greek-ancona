<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Terminal</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;z-index:5;background:#081d33;color:#fff;padding:12px;display:flex;justify-content:space-between}.wrap{padding:10px}.login{max-width:420px;margin:40px auto;background:#fff;padding:20px;border-radius:14px}.login input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd4dc;border-radius:8px;font-size:16px}.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:900}.primary{background:#0d3b66;color:#fff}.print{background:#f59e0b;color:#10263b}.green{background:#dcfce7;color:#166534}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.filter{border:0;border-radius:18px;padding:8px 11px;background:#fff;white-space:nowrap}.filter.on{background:#0d3b66;color:#fff}.order{background:#fff;border:1px solid #dbe2e8;border-radius:14px;margin-bottom:10px;overflow:hidden}.order.new{border:3px solid #f59e0b}.head{display:flex;justify-content:space-between;padding:11px;background:#f8fafc}.new .head{background:#fff7df}.num{font-size:22px;font-weight:900}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:12px;background:#dbeafe}.body{padding:11px}.customer{font-weight:800}.meta{font-size:12px;color:#617080;margin:4px 0 10px}.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}.mods{font-size:11px;color:#586779;padding:2px 0 5px 12px;white-space:pre-line}.total{font-size:19px;font-weight:900;text-align:right;padding-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 11px 11px}.empty{text-align:center;padding:50px;color:#758393}.native{font-size:11px;color:#b9d7f5}.err{color:#b91c1c;font-size:13px}</style></head><body><div id="app"></div><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const TOKEN='argo_admin_token_v1';let all=[],filter='open',lastNew='';const $=id=>document.getElementById(id),euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',','),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nativeAvailable(){return !!window.ArgoNative}function loginView(){app.innerHTML='<div class="top"><b>🇬🇷 ARGO TERMINAL</b><span class="native">SUNMI</span></div><div class="login"><h2>Accesso ARGO</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn primary" style="width:100%" onclick="login()">ENTRA</button><p id="le" class="err"></p></div>'}async function login(){let {data,error}=await sb.rpc('argo_admin_login',{p_email:em.value.trim(),p_password:pw.value});if(error||!data?.token){le.textContent='Accesso non riuscito';return}localStorage.setItem(TOKEN,data.token);start()}async function start(){let tok=localStorage.getItem(TOKEN);if(!tok){loginView();return}let {data}=await sb.rpc('argo_admin_valid',{p_token:tok});if(!data){localStorage.removeItem(TOKEN);loginView();return}app.innerHTML='<div class="top"><b>🍽️ ARGO ORDINI</b><span id="clock" class="native">SUNMI '+(nativeAvailable()?'✓':'WEB')+'</span></div><div class="wrap"><div class="filters"><button class="filter on" data-f="open">Aperti</button><button class="filter" data-f="new">Nuovi</button><button class="filter" data-f="accepted">Accettati</button><button class="filter" data-f="ready">Pronti</button><button class="filter" data-f="all">Tutti</button></div><div id="orders"></div></div>';document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});await load(true);setInterval(()=>load(false),5000);setInterval(()=>{if($('clock'))$('clock').textContent='SUNMI '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})},1000)}async function load(first=false){let {data,error}=await sb.rpc('argo_admin_orders',{p_token:localStorage.getItem(TOKEN)});if(error){if(String(error.message).toLowerCase().includes('token')){localStorage.removeItem(TOKEN);loginView()}return}let newest=(data||[]).find(x=>x.status==='new');if(!first&&newest&&newest.id!==lastNew)notify();lastNew=newest?.id||'';all=data||[];render()}function notify(){try{if(window.ArgoNative)ArgoNative.notifyNewOrder();else navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}function modText(i){let m=i.modifiers;if(!m)return'';if(Array.isArray(m))return m.map(x=>typeof x==='string'?x:(x.name||x.label||'')).filter(Boolean).join('\n');if(typeof m==='object')return Object.values(m).map(x=>typeof x==='string'?x:(x?.name||x?.label||'')).filter(Boolean).join('\n');return String(m)}function render(){let x=all.filter(o=>filter==='all'||(filter==='open'?!['completed','cancelled'].includes(o.status):o.status===filter));orders.innerHTML=x.length?x.map(card).join(''):'<div class="empty">Nessun ordine</div>'}function card(o){let t=new Date(o.created_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return `<article class="order ${o.status==='new'?'new':''}"><div class="head"><span class="num">#${o.order_number}</span><span class="pill">${esc(o.status.toUpperCase())} · ${t}</span></div><div class="body"><div class="customer">${esc(o.customer_name)} · ${esc(o.phone)}</div><div class="meta">RITIRO DAL LOCALE${o.requested_at?' · '+new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}</div>${(o.items||[]).map(i=>`<div class="line"><b>${i.quantity}× ${esc(i.name)}</b><span>${euro(i.line_total)}</span></div>${modText(i)?`<div class="mods">${esc(modText(i))}</div>`:''}${i.notes?`<div class="mods">Nota: ${esc(i.notes)}</div>`:''}`).join('')}${o.notes?`<p><b>NOTE:</b> ${esc(o.notes)}</p>`:''}<div class="total">${euro(o.total)}</div></div><div class="actions">${o.status==='new'?`<button class="btn print" onclick="act('${o.id}','accept_print')">✓ ACCETTA & STAMPA</button>`:`<button class="btn primary" onclick="act('${o.id}','reprint')">🖨 RISTAMPA</button>`}${o.status==='accepted'?`<button class="btn primary" onclick="act('${o.id}','preparing')">IN PREPARAZIONE</button>`:''}${['accepted','preparing'].includes(o.status)?`<button class="btn green" onclick="act('${o.id}','ready')">PRONTO</button>`:''}${o.status==='ready'?`<button class="btn green" onclick="act('${o.id}','completed')">CONSEGNATO</button>`:''}</div></article>`}async function act(id,a){let o=all.find(x=>x.id===id);let {error}=await sb.rpc('argo_admin_order_action',{p_token:localStorage.getItem(TOKEN),p_order_id:id,p_action:a});if(error){alert('Errore: '+error.message);return}if(a==='accept_print'||a==='reprint')printOrder(o);await load(true)}function printOrder(o){let lines=[];lines.push('ARGO GREEK COMFORT FOOD','*** ORDINE SITO ***','------------------------------','#'+o.order_number+'  RITIRO DAL LOCALE',new Date(o.created_at).toLocaleString('it-IT'),'------------------------------',o.customer_name,o.phone);if(o.requested_at)lines.push('ORA: '+new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));lines.push('------------------------------');(o.items||[]).forEach(i=>{lines.push(i.quantity+' x '+i.name);let m=modText(i);if(m)lines.push(m);if(i.notes)lines.push('Nota: '+i.notes)});lines.push('------------------------------');if(o.notes)lines.push('NOTE: '+o.notes,'------------------------------');if(Number(o.discount_amount)>0)lines.push('SUBTOTALE '+euro(o.subtotal),'SCONTO '+(o.promo_code||'')+': - '+euro(o.discount_amount));lines.push('TOTALE '+euro(o.total),'Pagamento: '+(o.payment_method||'al ritiro'),'','--- ARGO SITO WEB ---','','');let txt=lines.join('\n');try{if(window.ArgoNative)ArgoNative.printTicket(txt);else alert('Apri questa pagina dall’app ARGO SUNMI per stampare.')}catch(e){alert('Errore stampa: '+e.message)}}start()</script></body></html>
