<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Impostazioni</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:white;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:white;color:#0d3b66}.wrap{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:18px;margin-bottom:12px}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:8px}.btn{border:0;border-radius:9px;padding:11px 14px;background:#0d3b66;color:#fff;font-weight:900}.muted{color:#64748b;font-size:13px}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a class="active" href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><div class="card"><h3>Cambia password Admin</h3><div class="field"><label>Nuova password</label><input id="pwd" type="password" autocomplete="new-password"></div><button class="btn" id="save">SALVA PASSWORD</button><div id="msg" class="muted"></div></div><div class="card"><h3>ARGO Admin</h3><div class="muted">Gestione ordini, menu, promo, foto, prenotazioni e statistiche da un solo pannello.</div></div></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');async function valid(){let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data)location.href='./'}save.onclick=async()=>{msg.textContent='';if(pwd.value.length<8){msg.textContent='Minimo 8 caratteri.';return}let {data,error}=await sb.rpc('argo_admin_change_password',{p_token:tok(),p_new_password:pwd.value});msg.textContent=error?'Errore: '+error.message:(data?'Password aggiornata.':'Operazione non riuscita.');if(data)pwd.value=''};valid()</script></body></html>
