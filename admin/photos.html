<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin · Foto</title><meta name="theme-color" content="#173a67"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#182235}.top{position:sticky;top:0;z-index:10;background:#081d33;color:#fff;padding:10px 14px}.brand{font-size:20px;font-weight:900}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:#fff;color:#0d3b66}.wrap{max-width:1200px;margin:auto;padding:16px}.intro{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:14px;margin-bottom:14px}.intro b{color:#173a67}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.search{flex:1;min-width:220px;border:1px solid #ccd6e2;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #d9e0e9;background:#fff;color:#173a67;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.filters button.on{background:#173a67;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e0e5ec;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px #173a6712}.pic{aspect-ratio:4/3;background:#e9edf3;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.imgwarn{position:absolute;inset:auto 8px 8px 8px;background:#fff9;color:#7c2d12;border:1px solid #fed7aa;border-radius:8px;padding:7px 8px;font-size:11px;font-weight:800;text-align:center}.badge{position:absolute;top:9px;left:9px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#fff;color:#173a67;box-shadow:0 2px 8px #0003}.badge.menu{background:#dcfce7;color:#166534}.badge.future{background:#fef3c7;color:#92400e}.badge.archive{background:#fee2e2;color:#991b1b}.body{padding:12px}.title{font-weight:900;color:#173a67;font-size:16px}.meta{font-size:12px;color:#677285;margin-top:5px;line-height:1.45}.for{margin-top:8px;font-size:13px;font-weight:700}.note{margin-top:7px;font-size:12px;line-height:1.45;color:#555}.actions{display:flex;gap:8px;margin-top:11px}.actions a{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:9px 8px;font-size:12px;font-weight:800}.open{background:#173a67;color:#fff}.copy{background:#eef3f8;color:#173a67}.empty{padding:30px;text-align:center;color:#778}.err{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px}.count{font-size:12px;color:#667;margin:4px 0 14px}.morewrap{text-align:center;padding:18px 0}.morebtn{border:0;background:#173a67;color:#fff;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}.queuehint{font-size:12px;color:#667}.queuehint b{color:#92400e}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.wrap{padding:10px}.body{padding:9px}.title{font-size:14px}.actions{flex-direction:column}.brand{font-size:17px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a class="active" href="photos.html">📷 Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></header><main class="wrap"><div class="intro"><b>Foto reali ARGO</b><br><span style="font-size:13px;color:#667">Libreria interna per menu, homepage e social. Nessuna immagine AI/stock.</span></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="Cerca file, categoria, uso o piatto…"><span class="queuehint"><b>Da verificare</b> = conditional, candidate o verified non collegata</span></div><div class="filters"><button class="on" data-filter="all">Tutte</button><button data-filter="verify_queue">Da verificare</button><button data-filter="menu">Nel menu</button><button data-filter="hero">Hero</button><button data-filter="menu_verified">Menu verified</button><button data-filter="conditional">Conditional</button><button data-filter="social_group">Social</button><button data-filter="backstage_group">Backstage</button><button data-filter="heritage">Heritage</button><button data-filter="archive_group">Archivio</button><button data-filter="audit_reconciled">Reconciled</button><button data-filter="mezedes">Mezedes</button><button data-filter="salse">Salse</button><button data-filter="insalate">Insalate</button><button data-filter="dolci">Dolci</button></div><div id="count" class="count"></div><div id="grid" class="grid"><div class="empty">Caricamento…</div></div></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');let rows=[],filter='all',visibleLimit=36,searchText='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const t=localStorage.getItem('argo_admin_token_v1');if(!t){location.href='./';return}const {data:ok}=await sb.rpc('argo_admin_valid',{p_token:t});if(!ok){location.href='./';return}const {data,error}=await sb.rpc('argo_admin_media',{p_token:t});if(error){document.getElementById('grid').innerHTML='<div class="err">Errore caricamento libreria: '+esc(error.message)+'</div>';return}rows=data||[];render()}function statusLabel(r){if(r.status==='menu')return 'NEL MENU';if(r.status==='archive')return 'ARCHIVIO';const c=r.category||'';if(c==='hero')return 'HERO';if(c==='menu_verified')return 'MENU VERIFIED';if(c.includes('conditional'))return 'CONDITIONAL';if(c.includes('candidate'))return 'CANDIDATE';if(c.startsWith('social'))return 'SOCIAL';if(c.startsWith('backstage'))return 'BACKSTAGE';if(c==='heritage')return 'HERITAGE';if(c==='audit_reconciled')return 'RECONCILED';return 'PRONTA / FUTURA'}function imgFallback(el){const id=el.dataset.driveId||'';const step=Number(el.dataset.fallback||'0');const urls=[id?('https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w1200'):null,id?('https://drive.google.com/uc?export=view&id='+encodeURIComponent(id)):null].filter(Boolean);if(step<urls.length){el.dataset.fallback=String(step+1);el.src=urls[step];return}el.onerror=null;el.style.opacity='.18';el.alt='Anteprima non disponibile';const box=el.closest('.pic');if(box&&!box.querySelector('.imgwarn')){const w=document.createElement('div');w.className='imgwarn';w.textContent='Anteprima non disponibile · apri originale';box.appendChild(w)}}function needsVerification(r){const c=r.category||'';return c.includes('conditional')||c.includes('candidate')||(c==='menu_verified'&&!r.linked_menu_item_id)}function matchesFilter(r,f){const c=r.category||'';if(f==='all')return true;if(f==='verify_queue')return needsVerification(r);if(f==='menu')return r.status==='menu';if(f==='conditional')return c.includes('conditional');if(f==='social_group')return c.startsWith('social');if(f==='backstage_group')return c.startsWith('backstage');if(f==='archive_group')return r.status==='archive'||c.includes('archive');return r.status===f||c===f}function matchesSearch(r){if(!searchText)return true;const hay=[r.source_filename,r.title,r.category,r.recommended_for,r.notes,r.linked_menu_item_name].join(' ').toLowerCase();return hay.includes(searchText)}function render(){document.getElementById('morewrap')?.remove();const x=rows.filter(r=>matchesFilter(r,filter)&&matchesSearch(r));const shown=x.slice(0,visibleLimit);document.getElementById('count').textContent=Math.min(visibleLimit,x.length)+' / '+x.length+' foto';document.getElementById('grid').innerHTML=shown.map(r=>`<article class="card"><div class="pic"><img src="${esc(r.thumb_url)}" data-drive-id="${esc(r.source_drive_id||'')}" data-fallback="0" alt="${esc(r.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="imgFallback(this)"><span class="badge ${esc(r.status)}">${statusLabel(r)}</span></div><div class="body"><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.source_filename||'')} · ${esc(r.category||'')}</div><div class="for">Uso consigliato: ${esc(r.recommended_for||'—')}</div>${r.linked_menu_item_name?`<div class="meta">Collegata a: <b>${esc(r.linked_menu_item_name)}</b></div>`:''}<div class="note">${esc(r.notes||'')}</div><div class="actions"><a class="open" href="${esc(r.source_url)}" target="_blank" rel="noopener">Apri originale</a><a class="copy" href="#" onclick="navigator.clipboard.writeText('${esc(r.source_url)}');return false">Copia link</a></div></div></article>`).join('')||'<div class="empty">Nessuna foto con questi criteri.</div>';if(x.length>shown.length)document.getElementById('grid').insertAdjacentHTML('afterend','<div id="morewrap" class="morewrap"><button class="morebtn" onclick="visibleLimit+=36;render()">Carica altre foto</button></div>')}document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;visibleLimit=36;render()}));document.getElementById('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();visibleLimit=36;render()});boot();</script></body></html>
