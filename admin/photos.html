<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Foto</title><meta name="theme-color" content="#173a67"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#182235}.top{position:sticky;top:0;z-index:10;background:#173a67;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px #0002}.top a{color:#fff;text-decoration:none;font-weight:800;font-size:18px}.top h1{font-size:18px;margin:0}.wrap{max-width:1200px;margin:auto;padding:16px}.intro{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:14px;margin-bottom:14px}.intro b{color:#173a67}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #d9e0e9;background:#fff;color:#173a67;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.filters button.on{background:#173a67;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e0e5ec;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px #173a6712}.pic{aspect-ratio:4/3;background:#e9edf3;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:9px;left:9px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#fff;color:#173a67;box-shadow:0 2px 8px #0003}.badge.menu{background:#dcfce7;color:#166534}.badge.future{background:#fef3c7;color:#92400e}.body{padding:12px}.title{font-weight:900;color:#173a67;font-size:16px}.meta{font-size:12px;color:#677285;margin-top:5px;line-height:1.45}.for{margin-top:8px;font-size:13px;font-weight:700}.note{margin-top:7px;font-size:12px;line-height:1.45;color:#555}.actions{display:flex;gap:8px;margin-top:11px}.actions a{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:9px 8px;font-size:12px;font-weight:800}.open{background:#173a67;color:#fff}.copy{background:#eef3f8;color:#173a67}.empty{padding:30px;text-align:center;color:#778}.err{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px}.count{font-size:12px;color:#667;margin:4px 0 14px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.wrap{padding:10px}.body{padding:9px}.title{font-size:14px}.actions{flex-direction:column}.top h1{font-size:16px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><a href="./">‹</a><h1>🖼️ Libreria Foto ARGO</h1></header><main class="wrap"><div class="intro"><b>Foto reali ARGO</b><br><span style="font-size:13px;color:#667">Qui teniamo sia le foto abbinate al menu attuale, sia quelle belle pronte per futuri piatti. Le immagini AI/stock non entrano in questa libreria.</span></div><div class="filters"><button class="on" data-filter="all">Tutte</button><button data-filter="menu">Nel menu</button><button data-filter="future">Pronte / future</button><button data-filter="mezedes">Mezedes</button><button data-filter="salse">Salse</button><button data-filter="insalate">Insalate</button><button data-filter="dolci">Dolci</button></div><div id="count" class="count"></div><div id="grid" class="grid"><div class="empty">Caricamento…</div></div></main><script>
const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');let rows=[],filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){const t=localStorage.getItem('argo_admin_token_v1');if(!t){location.href='./';return}const {data:ok}=await sb.rpc('argo_admin_valid',{p_token:t});if(!ok){location.href='./';return}const {data,error}=await sb.rpc('argo_admin_media',{p_token:t});if(error){document.getElementById('grid').innerHTML='<div class="err">Errore caricamento libreria.</div>';return}rows=data||[];render()}
function render(){let x=rows;if(filter!=='all')x=rows.filter(r=>r.status===filter||r.category===filter);document.getElementById('count').textContent=x.length+' foto selezionate';document.getElementById('grid').innerHTML=x.map(r=>`<article class="card"><div class="pic"><img src="${esc(r.thumb_url)}" alt="${esc(r.title)}" loading="lazy" onerror="this.style.opacity=.15"><span class="badge ${esc(r.status)}">${r.status==='menu'?'NEL MENU':'PRONTA / FUTURA'}</span></div><div class="body"><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.source_filename||'')} · ${esc(r.category||'')}</div><div class="for">Uso consigliato: ${esc(r.recommended_for||'—')}</div>${r.linked_menu_item_name?`<div class="meta">Collegata a: <b>${esc(r.linked_menu_item_name)}</b></div>`:''}<div class="note">${esc(r.notes||'')}</div><div class="actions"><a class="open" href="${esc(r.source_url)}" target="_blank" rel="noopener">Apri originale</a><a class="copy" href="#" onclick="navigator.clipboard.writeText('${esc(r.source_url)}');return false">Copia link</a></div></div></article>`).join('')||'<div class="empty">Nessuna foto in questa categoria.</div>'}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()}));boot();
</script></body></html>
