<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARGO · Menu disponibile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#eef2f6}
.bar{position:sticky;top:0;z-index:5;background:#081d33;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar b{margin-right:auto}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.print{background:#fff;color:#081d33}.back{background:#173b60;color:#fff}
.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:12mm 13mm;box-shadow:0 10px 30px #0002}
.head{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px}.head h1{font-size:25px;margin:0}.head .sub{font-size:11px;margin-top:4px}.stamp{font-size:9px;color:#666;margin-top:5px}
.cols{columns:2;column-gap:12mm}.section{break-inside:avoid;margin:0 0 12px}.section h2{font-size:16px;margin:0 0 5px;border-bottom:1px solid #333;padding-bottom:3px;text-transform:uppercase}.item{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0 0 6px;break-inside:avoid}.name{font-weight:800;font-size:12px}.desc{font-size:9px;color:#444;line-height:1.25;margin-top:1px}.price{font-weight:900;font-size:12px;white-space:nowrap}.extra{border:1px solid #333;padding:6px 8px;margin:4px 0 8px;font-size:10px;font-weight:800;line-height:1.4}.hero{border:2px solid #111;padding:10px 11px;margin:0 0 12px;break-inside:avoid}.hero h2{margin:0 0 4px;font-size:18px;text-transform:uppercase}.hero p{margin:0;font-size:10px;line-height:1.35}.comboGrid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px}.combo{border:1px solid #777;padding:7px 8px;break-inside:avoid}.comboHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.comboName{font-weight:900;font-size:12px}.comboPrice{font-weight:900;font-size:12px;white-space:nowrap}.comboDesc{font-size:9px;line-height:1.35;color:#333;margin-top:2px}.nudge{font-size:9px;font-weight:800;margin-top:5px}.section.meze h2{font-size:18px}.section.meze{border-top:2px solid #111;padding-top:5px}
.footer{margin-top:12px;padding-top:6px;border-top:1px solid #999;text-align:center;font-size:9px}
.empty{padding:30px;text-align:center;color:#991b1b}
@media print{body{background:#fff}.bar{display:none}.sheet{width:auto;min-height:auto;margin:0;box-shadow:none;padding:8mm 10mm}@page{size:A4;margin:0}}
@media(max-width:900px){.sheet{width:100%;min-height:auto;margin:0;padding:18px}.cols{columns:1}}
</style>
</head>
<body>
<div class="bar"><b>ARGO · Menu disponibile</b><a class="btn back" href="menu.html">← Menu admin</a><button class="btn print" id="printBtn">🖨️ STAMPA</button></div>
<main class="sheet">
<div class="head"><h1>ARGO Greek Comfort Food</h1><div class="sub">Via Marconi 27 · Ancona</div><div id="stamp" class="stamp"></div></div>
<div id="content"><div class="empty">Caricamento menu…</div></div>
<div class="footer">Menu stampato in base alla disponibilità corrente. I prodotti messi OFF dall'admin non vengono inclusi.</div>
</main>
<script>
const SB_URL='https://zibubwrntdmdxyimqddo.supabase.co',SB_KEY='sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL';
const sb=supabase.createClient(SB_URL,SB_KEY),token=()=>localStorage.getItem('argo_admin_token_v1'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',',');
async function load(){
 const t=token(); if(!t){location.replace('./');return}
 const [{data:ok,error:ve},{data:items,error:ie},{data:cats,error:ce}]=await Promise.all([
  sb.rpc('argo_admin_valid',{p_token:t}),
  sb.rpc('argo_admin_menu',{p_token:t}),
  sb.rpc('argo_admin_categories',{p_token:t})
 ]);
 if(ve||!ok){location.replace('./');return}
 if(ie||ce){document.getElementById('content').innerHTML='<div class="empty">Errore caricamento menu</div>';return}
 const active=(items||[]).filter(x=>x.active),activeCats=(cats||[]).filter(c=>c.active!==false&&String(c.slug||'').toLowerCase()!=='posate'),by={};for(const x of active)(by[x.category_id]??=[]).push(x);
 document.getElementById('stamp').textContent='Aggiornato: '+new Intl.DateTimeFormat('it-IT',{dateStyle:'short',timeStyle:'short'}).format(new Date());
 const getItem=name=>active.find(x=>String(x.name).toLowerCase()===String(name).toLowerCase()),sum=names=>names.reduce((t,n)=>t+Number(getItem(n)?.price||0),0);
 const combos=[
  {name:'TAVOLA GRECA CLASSICA · per 2',items:['Saganaki','Dolmas','Tzatziki','Pita greca'],note:'Caldo, fresco e cremoso: il modo più semplice per iniziare a condividere.'},
  {name:'TAVOLA CALDA ARGO · per 2',items:['Saganaki','Keftedakia','Spiedino di suino con pita e salsa','Tirokafteri'],note:'Più saporita e sostanziosa: perfetta se volete assaggiare carne, formaggio e salsa piccante.'},
  {name:'TAVOLA VEGETARIANA · per 2',items:['Halloumi alla griglia','Polpettine di Ceci','Dolmas','Melitzanosalata','Pita greca'],note:'Cinque sapori diversi da mettere al centro e condividere.'}
 ].filter(c=>c.items.every(n=>getItem(n)));
 const hero=`<section class="hero"><h2>MEZEDES DA CONDIVIDERE</h2><p><b>Il modo greco di mangiare:</b> scegli più piattini, mettili al centro e assaggia tutto. Per 2 persone consigliamo 3–5 mezedes + pita e salsa.</p><div class="comboGrid">${combos.map(c=>`<div class="combo"><div class="comboHead"><div class="comboName">${esc(c.name)}</div><div class="comboPrice">${euro(sum(c.items))}</div></div><div class="comboDesc">${c.items.map(esc).join(' · ')}</div><div class="nudge">${esc(c.note)}</div></div>`).join('')}</div></section>`;
 const priority={mezedes:1,salse:2,piatti:3,pita:4,insalate:5,vegetariano:6,dolci:7,bevande:8,birre:9,vini:10};
 const ordered=[...activeCats].sort((a,b)=>(priority[String(a.slug||'').toLowerCase()]||50)-(priority[String(b.slug||'').toLowerCase()]||50)||Number(a.sort_order||0)-Number(b.sort_order||0));
 document.getElementById('content').innerHTML=hero+'<div class="cols">'+ordered.filter(c=>by[c.id]?.length).map(c=>{const slug=String(c.slug||'').toLowerCase(),meze=slug==='mezedes';return `<section class="section ${meze?'meze':''}"><h2>${meze?'MEZEDES · METTILI AL CENTRO':esc(c.name)}</h2>${meze?'<div class="extra">IDEA ARGO · Abbina 2–3 mezedes + 1 salsa + pita. Più varietà al tavolo, più gusto per tutti.</div>':''}${slug==='salse'?'<div class="extra">PER CONDIVIDERE · Una salsa grande + pita trasforma i mezedes in una vera tavola greca.</div>':''}${slug==='pita'?'<div class="extra">EXTRA PITE · Doppia salsa + € 1,00 · Feta o Halloumi + € 1,50</div>':''}${by[c.id].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||String(a.name).localeCompare(String(b.name))).map(x=>`<div class="item"><div><div class="name">${esc(x.name)}</div>${x.description?`<div class="desc">${esc(x.description)}</div>`:''}</div><div class="price">${euro(x.price)}</div></div>`).join('')}</section>`}).join('')+'</div>';
 if(new URLSearchParams(location.search).get('autoprint')==='1')setTimeout(()=>window.print(),250);
}
document.getElementById('printBtn').onclick=()=>window.print();load();
</script>
</body></html>
