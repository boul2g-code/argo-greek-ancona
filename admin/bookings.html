<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Prenotazioni</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:white;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:white;color:#0d3b66}.wrap{max-width:1000px;margin:auto;padding:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.sum{background:#fff;border:1px solid #dbe2e8;border-radius:12px;padding:12px}.sum b{display:block;font-size:23px;color:#0d3b66}.sum span{font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filter{border:0;border-radius:18px;padding:9px 12px;background:#fff;font-weight:800;white-space:nowrap}.filter.on{background:#0d3b66;color:#fff}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:14px;margin-bottom:10px}.card.upcoming{border-left:5px solid #0d3b66}.name{font-weight:900;font-size:18px}.meta{color:#64748b;font-size:13px;margin:5px 0}.status{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef3f8;color:#173a67;font-size:10px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.done{background:#dbeafe;color:#164e9b}.empty{text-align:center;padding:40px;color:#64748b}.error{background:#fee2e2;color:#991b1b;border-radius:10px;padding:12px;font-weight:800}@media(max-width:620px){.summary{grid-template-columns:repeat(2,1fr)}.brand{font-size:17px}}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="marketing.html">📣 Marketing</a><a href="photos.html">📷 Foto</a><a href="photo-review.html">✅ Verifica Foto</a><a href="photo-shoot-plan.html">📋 Piano Foto</a><a class="active" href="bookings.html">📅 Prenotazioni</a><a href="booking-history.html">🕘 Storico Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><section class="summary"><div class="sum"><b id="sNew">0</b><span>Nuove</span></div><div class="sum"><b id="sConfirmed">0</b><span>Confermate</span></div><div class="sum"><b id="sCompleted">0</b><span>Completate</span></div><div class="sum"><b id="sCancelled">0</b><span>Annullate</span></div></section><div class="filters"><button class="filter on" data-f="open">Aperte</button><button class="filter" data-f="new">Nuove</button><button class="filter" data-f="confirmed">Confermate</button><button class="filter" data-f="completed">Completate</button><button class="filter" data-f="cancelled">Annullate</button><button class="filter" data-f="all">Tutte</button></div><div id="err"></div><div id="wrap"></div></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');const $=id=>document.getElementById(id);let all=[],filter='open',busy=new Set();function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function valid(){if(!tok()){location.href='./';return false}let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data){localStorage.removeItem('argo_admin_token_v1');location.href='./';return false}return true}function renderSummary(){$('sNew').textContent=all.filter(x=>x.status==='new').length;$('sConfirmed').textContent=all.filter(x=>x.status==='confirmed').length;$('sCompleted').textContent=all.filter(x=>x.status==='completed').length;$('sCancelled').textContent=all.filter(x=>x.status==='cancelled').length}function actions(x){const d=busy.has(x.id)?' disabled':'';if(x.status==='new')return `<button class="btn ok"${d} onclick="setStatus('${x.id}','confirmed')">✓ CONFERMA</button><button class="btn bad"${d} onclick="setStatus('${x.id}','cancelled')">ANNULLA</button>`;if(x.status==='confirmed')return `<button class="btn done"${d} onclick="setStatus('${x.id}','completed')">✓ COMPLETATA</button><button class="btn bad"${d} onclick="setStatus('${x.id}','cancelled')">ANNULLA</button>`;return ''}function bookingTs(x){const d=x.booking_date||'',t=String(x.booking_time||'00:00').slice(0,5);const ms=Date.parse(d+'T'+t+':00');return Number.isFinite(ms)?ms:0}function render(){renderSummary();let a=all.filter(x=>filter==='all'||(filter==='open'?['new','confirmed'].includes(x.status):x.status===filter));a=[...a].sort((x,y)=>filter==='open'?bookingTs(x)-bookingTs(y):new Date(y.created_at)-new Date(x.created_at));const now=Date.now();$('wrap').innerHTML=a.length?a.map(x=>`<div class="card ${['new','confirmed'].includes(x.status)&&bookingTs(x)>=now?'upcoming':''}"><div class="name">${esc(x.name||'Prenotazione')}</div><div class="meta">${esc(x.phone||'')}${x.email?' · '+esc(x.email):''}</div><div class="meta"><b>${esc(x.booking_date||'')}</b>${x.booking_time?' · '+esc(String(x.booking_time).slice(0,5)):''}</div><div class="meta">Persone: ${esc(x.guests||'—')} · <span class="status">${esc((x.status||'new').toUpperCase())}</span></div>${x.notes?'<div class="meta"><b>Note:</b> '+esc(x.notes)+'</div>':''}<div class="actions">${actions(x)}</div></div>`).join(''):'<div class="empty">Nessuna prenotazione</div>'}async function load(){const {data,error}=await sb.rpc('argo_admin_bookings',{p_token:tok()});if(error){$('err').innerHTML='<div class="error">Errore: '+esc(error.message)+'</div>';return}all=data||[];render()}async function setStatus(id,status){if(busy.has(id))return;const row=all.find(x=>x.id===id);if(status==='cancelled'&&!confirm('Annullare la prenotazione di '+(row?.name||'questo cliente')+'?'))return;busy.add(id);render();const {error}=await sb.rpc('argo_admin_booking_status',{p_token:tok(),p_id:id,p_status:status});busy.delete(id);if(error){render();alert(error.message);return}await load()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});(async()=>{if(await valid())await load()})();</script></body></html>
