<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Prenotazioni</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:white;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:white;color:#0d3b66}.wrap{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:14px;margin-bottom:10px}.name{font-weight:900;font-size:18px}.meta{color:#64748b;font-size:13px;margin:5px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:800}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.done{background:#dbeafe;color:#164e9b}.empty{text-align:center;padding:40px;color:#64748b}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a class="active" href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main id="wrap" class="wrap"></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');async function valid(){let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data)location.href='./'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){let {data,error}=await sb.rpc('argo_admin_bookings',{p_token:tok()});if(error)return wrap.innerHTML='<div class="empty">Errore: '+esc(error.message)+'</div>';let a=data||[];wrap.innerHTML=a.length?a.map(x=>`<div class="card"><div class="name">${esc(x.name||x.customer_name||'Prenotazione')}</div><div class="meta">${esc(x.phone||'')} ${x.email?' · '+esc(x.email):''}</div><div class="meta">${x.booking_date||x.date||x.starts_at?esc(x.booking_date||x.date||x.starts_at):''} ${x.booking_time||x.time?' · '+esc(x.booking_time||x.time):''}</div><div class="meta">Persone: ${esc(x.guests||x.people||x.party_size||'—')} · Stato: <b>${esc(x.status||'new')}</b></div>${x.notes?'<div class="meta"><b>Note:</b> '+esc(x.notes)+'</div>':''}<div class="actions"><button class="btn ok" onclick="setStatus('${x.id}','confirmed')">Conferma</button><button class="btn done" onclick="setStatus('${x.id}','completed')">Completata</button><button class="btn bad" onclick="setStatus('${x.id}','cancelled')">Annulla</button></div></div>`).join(''):'<div class="empty">Nessuna prenotazione</div>'}async function setStatus(id,status){let {error}=await sb.rpc('argo_admin_booking_status',{p_token:tok(),p_id:id,p_status:status});if(error)return alert(error.message);load()}valid().then(load)</script></body></html>
