<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin</title><meta name="theme-color" content="#081d33"><link rel="icon" href="../admin-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../admin-icon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#081d33,#0d3b66);color:#fff;min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:#fff;color:#132238;border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.logo{font-size:34px;font-weight:800;color:#0d3b66;letter-spacing:2px}.sub{color:#6b7280;margin:6px 0 26px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:14px 16px;border:1.5px solid #dbe1e8;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:#0d3b66;color:#fff;font-size:16px;font-weight:800;margin-top:8px}.msg{font-size:13px;margin-top:14px;min-height:20px}.back{display:block;text-align:center;margin-top:20px;color:#6b7280;text-decoration:none;font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="card"><div class="logo">ARGO ADMIN</div><div class="sub">Accesso pannello di controllo</div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" value="boul2g@gmail.com" readonly></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entra</button><div class="msg" id="msg"></div></form><a class="back" href="../">← Torna al sito ARGO</a></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const f=document.getElementById('f'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Accesso in corso…';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await sb.rpc('argo_admin_login',{p_email:email,p_password:password});if(error||!data){m.textContent='Email o password non validi.';return}localStorage.setItem('argo_admin_token_v1',data);sessionStorage.setItem('admin_auth',String(Date.now()+8*3600000));location.href='../admin.html';});</script></body></html>
