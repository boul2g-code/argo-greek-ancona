<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin</title><meta name="theme-color" content="#081d33"><link rel="icon" href="../admin-icon.svg" type="image/svg+xml"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#081d33}.login-wrap{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#081d33,#0d3b66);color:#fff}.card{width:min(420px,100%);background:#fff;color:#132238;border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.logo{font-size:34px;font-weight:900;color:#0d3b66;letter-spacing:2px}.sub{color:#6b7280;margin:6px 0 26px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:14px 16px;border:1.5px solid #dbe1e8;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:#0d3b66;color:#fff;font-size:16px;font-weight:800;margin-top:8px}.msg{font-size:13px;margin-top:14px;min-height:20px}.back{display:block;text-align:center;margin-top:20px;color:#6b7280;text-decoration:none;font-size:13px}#dashboard{display:none;width:100%;height:100svh;border:0;background:#eef2f6}</style></head><body><div id="login" class="login-wrap"><main class="card"><div class="logo">ARGO ADMIN</div><div class="sub">Ordini e gestione operativa</div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" value="boul2g@gmail.com" readonly></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entra</button><div class="msg" id="msg"></div></form><a class="back" href="../">← Torna al sito ARGO</a></main></div><iframe id="dashboard" title="ARGO Admin Dashboard"></iframe><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const f=document.getElementById('f'),m=document.getElementById('msg'),login=document.getElementById('login'),dash=document.getElementById('dashboard');async function tokenValid(){const t=localStorage.getItem('argo_admin_token_v1');if(!t)return false;try{const {data,error}=await sb.rpc('argo_admin_valid',{p_token:t});return !error&&data===true}catch(e){return false}}function showDashboard(){login.style.display='none';dash.style.display='block';dash.src='orders.html'}async function boot(){if(await tokenValid())showDashboard()}f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Accesso in corso…';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await sb.rpc('argo_admin_login',{p_email:email,p_password:password});if(error||!data){m.textContent='Email o password non validi.';return}localStorage.setItem('argo_admin_token_v1',data);showDashboard()});boot();</script></body></html>
