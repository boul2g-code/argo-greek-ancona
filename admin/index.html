<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin</title><meta name="theme-color" content="#081d33"><link rel="icon" href="../admin-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../admin-icon.svg"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#081d33}.login-wrap{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#081d33,#0d3b66);color:#fff}.card{width:min(420px,100%);background:#fff;color:#132238;border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.logo{font-size:34px;font-weight:800;color:#0d3b66;letter-spacing:2px}.sub{color:#6b7280;margin:6px 0 26px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:14px 16px;border:1.5px solid #dbe1e8;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:#0d3b66;color:#fff;font-size:16px;font-weight:800;margin-top:8px}.msg{font-size:13px;margin-top:14px;min-height:20px}.back{display:block;text-align:center;margin-top:20px;color:#6b7280;text-decoration:none;font-size:13px}#dashboard{display:none;width:100%;height:100svh;border:0;background:#f9fafb}@media(max-width:1100px){.card{padding:26px;border-radius:18px}.logo{font-size:28px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="login" class="login-wrap"><main class="card"><div class="logo">ARGO ADMIN</div><div class="sub">Accesso pannello di controllo</div><form id="f"><div class="field"><label>Email</label><input id="email" type="email" value="boul2g@gmail.com" readonly></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entra</button><div class="msg" id="msg"></div></form><a class="back" href="../">← Torna al sito ARGO</a></main></div><iframe id="dashboard" title="ARGO Admin Dashboard"></iframe><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const f=document.getElementById('f'),m=document.getElementById('msg'),login=document.getElementById('login'),dash=document.getElementById('dashboard');async function tokenValid(){const t=localStorage.getItem('argo_admin_token_v1');if(!t)return false;try{const {data,error}=await sb.rpc('argo_admin_valid',{p_token:t});return !error&&data===true}catch(e){return false}}function injectCompact(){try{const d=dash.contentDocument||dash.contentWindow.document;const s=d.createElement('style');s.textContent=`@media (min-width:700px) and (max-width:1200px){.sidebar{width:160px!important}.sidebar-logo{padding:11px 10px!important}.sidebar-logo .name{font-size:14px!important}.sidebar-logo .sub{font-size:8px!important}.sidebar-nav{padding:6px!important}.sidebar-section{padding:8px 5px 4px!important;font-size:8px!important}.nav-item{padding:6px 7px!important;gap:6px!important;font-size:10px!important;margin-bottom:1px!important}.nav-item .icon{font-size:13px!important;width:16px!important}.topbar{padding:7px 12px!important;min-height:38px!important}.topbar-title{font-size:14px!important}.content{padding:10px 12px!important;max-width:none!important}.stats-row{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;margin-bottom:6px!important}.stat-card{padding:6px 7px!important;border-radius:7px!important;min-height:52px!important;box-shadow:none!important}.stat-label{font-size:7.5px!important;line-height:1!important;margin-bottom:2px!important;letter-spacing:.2px!important}.stat-value{font-size:1rem!important;line-height:1.05!important}.stat-change{font-size:7.5px!important;line-height:1!important;margin-top:2px!important}.quick-links{display:flex!important;gap:4px!important;margin-bottom:7px!important;align-items:stretch!important;flex-wrap:nowrap!important}.quick-link{flex:1 1 0!important;min-width:0!important;padding:4px 6px!important;border-radius:7px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:4px!important;min-height:29px!important;box-shadow:none!important}.quick-link .ql-icon{font-size:12px!important;margin:0!important;line-height:1!important}.quick-link .ql-name{font-size:8px!important;line-height:1!important;white-space:nowrap!important}.quick-link .ql-desc{display:none!important}.card{padding:10px!important}.card-title{font-size:12px!important;margin-bottom:7px!important}.menu-table th{padding:6px 7px!important;font-size:8px!important}.menu-table td{padding:6px 7px!important;font-size:10px!important}.btn{padding:6px 9px!important;font-size:10px!important}.photo-grid{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}.analytics-grid{gap:7px!important}.analytics-card{padding:10px!important}.composer{padding:10px!important}.hub-grid{gap:7px!important}}@media (min-width:700px) and (max-width:900px){.sidebar{width:140px!important}.content{padding:7px!important}.topbar{padding:6px 8px!important}.stats-row{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important}.stat-card{padding:5px!important;min-height:47px!important}.stat-label{font-size:7px!important}.stat-value{font-size:.9rem!important}.stat-change{font-size:7px!important}.quick-links{gap:3px!important}.quick-link{padding:3px 4px!important;gap:3px!important;min-height:26px!important}.quick-link .ql-icon{font-size:11px!important}.quick-link .ql-name{font-size:7.5px!important}}`;d.head.appendChild(s);}catch(e){}}function showDashboard(){sessionStorage.setItem('admin_auth',String(Date.now()+8*3600000));login.style.display='none';dash.style.display='block';dash.src='../admin.html';dash.addEventListener('load',injectCompact,{once:true})}async function boot(){if(await tokenValid())showDashboard()}f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Accesso in corso…';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await sb.rpc('argo_admin_login',{p_email:email,p_password:password});if(error||!data){m.textContent='Email o password non validi.';return}localStorage.setItem('argo_admin_token_v1',data);showDashboard()});boot();</script></body></html>
