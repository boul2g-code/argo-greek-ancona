<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Storico Ordini</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:#fff;padding:10px 14px;z-index:10}.brand{font-size:20px;font-weight:900}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.wrap{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:220px;padding:10px;border:1px solid #ccd5df;border-radius:9px}.row{display:grid;grid-template-columns:120px 140px 1fr 180px;gap:10px;padding:10px 0;border-bottom:1px solid #eee;align-items:center}.row:last-child{border:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f8;color:#173a67;font-size:10px;font-weight:900}.meta{font-size:12px;color:#64748b}.empty{padding:30px;text-align:center;color:#64748b}.err{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px}@media(max-width:700px){.row{grid-template-columns:1fr}.brand{font-size:17px}}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN · STORICO ORDINI</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="orders-sunmi.html">🖨 SUNMI</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><div class="card"><div class="toolbar"><input id="q" placeholder="Cerca ordine, azione, stato o admin…"></div><div id="list"><div class="empty">Caricamento…</div></div></div></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];function render(){const s=q.value.trim().toLowerCase(),a=rows.filter(x=>!s||['#'+x.order_number,x.action,x.old_status,x.new_status,x.admin_email].join(' ').toLowerCase().includes(s));list.innerHTML=a.map(x=>`<div class="row"><div><b>#${x.order_number}</b><div class="meta">${new Date(x.created_at).toLocaleString('it-IT')}</div></div><div><span class="pill">${esc(x.action)}</span></div><div><b>${esc(x.old_status||'—')} → ${esc(x.new_status||'—')}</b><div class="meta">print count: ${Number(x.detail?.print_count||0)}</div></div><div class="meta">${esc(x.admin_email||'—')}</div></div>`).join('')||'<div class="empty">Nessun evento.</div>'}async function boot(){if(!tok()){location.href='./';return}const {data:ok}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!ok){localStorage.removeItem('argo_admin_token_v1');location.href='./';return}const {data,error}=await sb.rpc('argo_admin_order_history',{p_token:tok(),p_order_id:null});if(error){list.innerHTML='<div class="err">Errore: '+esc(error.message)+'</div>';return}rows=data||[];render()}q.oninput=render;boot()</script></body></html>
