<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARGO Admin · Verifica Foto</title>
<meta name="theme-color" content="#173a67">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#182235}.top{position:sticky;top:0;z-index:20;background:#081d33;color:#fff;padding:10px 14px}.brand{font-size:20px;font-weight:900}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:#fff;color:#0d3b66}.wrap{max-width:1100px;margin:auto;padding:16px}.intro,.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px}.intro{padding:14px;margin-bottom:14px}.queue{display:grid;gap:14px}.card{overflow:hidden;box-shadow:0 4px 14px #173a6712}.layout{display:grid;grid-template-columns:minmax(280px,42%) 1fr}.pic{background:#e9edf3;min-height:320px;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}.imgwarn{position:absolute;left:10px;right:10px;bottom:10px;background:#fff9;color:#7c2d12;border:1px solid #fed7aa;border-radius:8px;padding:8px;font-size:12px;font-weight:800;text-align:center}.body{padding:14px}.title{font-size:18px;font-weight:900;color:#173a67}.meta{font-size:12px;color:#667;margin-top:5px;line-height:1.5}.why{margin:10px 0;padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:900;color:#68768a}.field input,.field select,.field textarea{border:1px solid #cfd8e3;border-radius:9px;padding:9px 10px;font:inherit;background:#fff;color:#182235}.field textarea{min-height:76px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:#173a67;color:#fff}.hold{background:#fef3c7;color:#92400e}.archive{background:#fee2e2;color:#991b1b}.open{display:inline-block;text-decoration:none;background:#eef3f8;color:#173a67}.syncbox{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700}.msg{margin-top:8px;font-size:12px;font-weight:800}.ok{color:#166534}.bad{color:#991b1b}.empty{padding:32px;text-align:center;color:#667;background:#fff;border-radius:14px}.count{font-size:12px;color:#667;margin:4px 0 14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;border:1px solid #ccd6e2;border-radius:10px;padding:10px 12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.pic{min-height:260px}.row{grid-template-columns:1fr}.wrap{padding:10px}.brand{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a class="active" href="photo-review.html">✅ Verifica Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></header>
<main class="wrap">
<div class="intro"><b>Verifica foto</b><br><span style="font-size:13px;color:#667">Qui compaiono solo foto conditional/candidate. Per pubblicare nel menu serve identità certa del prodotto e corrispondenza con la porzione attuale.</span></div>
<div class="toolbar"><input id="search" type="search" placeholder="Cerca filename, prodotto, nota…"><a class="btn open" href="photos.html">← Libreria completa</a></div>
<div id="count" class="count"></div><div id="queue" class="queue"><div class="empty">Caricamento…</div></div>
</main>
<script>
const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');
let token='',media=[],menu=[],search='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function needs(r){const c=r.category||'';return c.includes('conditional')||c.includes('candidate')}
function fallback(el){const id=el.dataset.id||'',step=Number(el.dataset.step||0),urls=[id?`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w1200`:null,id?`https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`:null].filter(Boolean);if(step<urls.length){el.dataset.step=String(step+1);el.src=urls[step];return}el.onerror=null;el.style.opacity='.18';const p=el.closest('.pic');if(p&&!p.querySelector('.imgwarn'))p.insertAdjacentHTML('beforeend','<div class="imgwarn">Anteprima non disponibile · apri originale</div>')}
function menuOpts(selected){return '<option value="">— nessun collegamento —</option>'+menu.filter(x=>x.active).map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)} · €${Number(x.price).toFixed(2)}</option>`).join('')}
function catOpts(c){const cats=['menu_conditional','menu_candidate','menu_verified','social_conditional','backstage_conditional','dessert_conditional','salse_conditional','social','backstage','archive'];return cats.map(x=>`<option value="${x}" ${x===c?'selected':''}>${x}</option>`).join('')}
function render(){const q=search.trim().toLowerCase();const rows=media.filter(needs).filter(r=>!q||[r.source_filename,r.title,r.category,r.recommended_for,r.notes].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`${rows.length} foto da verificare`;document.getElementById('queue').innerHTML=rows.map(r=>`<article class="card" id="card-${r.id}"><div class="layout"><div class="pic"><img src="${esc(r.thumb_url)}" data-id="${esc(r.source_drive_id||'')}" data-step="0" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="fallback(this)" alt="${esc(r.title)}"></div><div class="body"><div class="title">${esc(r.title||r.source_filename)}</div><div class="meta">${esc(r.source_filename)} · ${esc(r.category)}</div><div class="why">${esc(r.recommended_for||'Verifica manuale richiesta')}</div><div class="row"><div class="field"><label>Categoria</label><select id="cat-${r.id}">${catOpts(r.category)}</select></div><div class="field"><label>Stato</label><select id="status-${r.id}"><option value="future" ${r.status==='future'?'selected':''}>future / hold</option><option value="menu" ${r.status==='menu'?'selected':''}>menu</option><option value="archive" ${r.status==='archive'?'selected':''}>archive</option></select></div></div><div class="field" style="margin-top:10px"><label>Collega a prodotto menu</label><select id="item-${r.id}">${menuOpts(r.linked_menu_item_id)}</select></div><div class="field" style="margin-top:10px"><label>Uso consigliato / verdetto</label><textarea id="rec-${r.id}">${esc(r.recommended_for||'')}</textarea></div><div class="field" style="margin-top:10px"><label>Note verifica</label><textarea id="note-${r.id}">${esc(r.notes||'')}</textarea></div><label class="syncbox"><input id="sync-${r.id}" type="checkbox"> Imposta anche questa immagine come foto del prodotto nel menu</label><div class="actions"><button class="btn primary" onclick="save('${r.id}')">Salva verifica</button><button class="btn hold" onclick="hold('${r.id}')">Mantieni HOLD</button><button class="btn archive" onclick="archiveIt('${r.id}')">Archivia</button><a class="btn open" href="${esc(r.source_url)}" target="_blank" rel="noopener">Apri originale</a></div><div id="msg-${r.id}" class="msg"></div></div></div></article>`).join('')||'<div class="empty">Nessuna foto rimasta nella coda di verifica.</div>'}
async function rpcSave(id,overrides={}){const cat=overrides.category??document.getElementById('cat-'+id).value,status=overrides.status??document.getElementById('status-'+id).value,item=overrides.item===undefined?(document.getElementById('item-'+id).value||null):overrides.item,rec=overrides.rec??document.getElementById('rec-'+id).value,notes=overrides.notes??document.getElementById('note-'+id).value,sync=overrides.sync??document.getElementById('sync-'+id).checked;const msg=document.getElementById('msg-'+id);msg.className='msg';msg.textContent='Salvataggio…';const {data,error}=await sb.rpc('argo_admin_media_review',{p_token:token,p_media_id:id,p_category:cat,p_status:status,p_recommended_for:rec,p_notes:notes,p_linked_menu_item_id:item,p_sync_menu_image:sync});if(error){msg.classList.add('bad');msg.textContent='Errore: '+error.message;return false}msg.classList.add('ok');msg.textContent='Salvato';return !!data}
async function save(id){if(await rpcSave(id))await reload()}
async function hold(id){if(await rpcSave(id,{status:'future',sync:false}))await reload()}
async function archiveIt(id){if(!confirm('Archiviare questa foto?'))return;if(await rpcSave(id,{category:'archive',status:'archive',item:null,sync:false}))await reload()}
async function reload(){const {data,error}=await sb.rpc('argo_admin_media',{p_token:token});if(error)return;media=data||[];render()}
async function boot(){token=localStorage.getItem('argo_admin_token_v1')||'';if(!token){location.href='./';return}const {data:ok}=await sb.rpc('argo_admin_valid',{p_token:token});if(!ok){location.href='./';return}const [m,n]=await Promise.all([sb.rpc('argo_admin_media',{p_token:token}),sb.rpc('argo_admin_menu',{p_token:token})]);if(m.error||n.error){document.getElementById('queue').innerHTML='<div class="empty">Errore caricamento dati.</div>';return}media=m.data||[];menu=n.data||[];render()}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;render()});boot();
</script>
</body>
</html>
