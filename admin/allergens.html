<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARGO Admin · Allergeni</title><meta name="theme-color" content="#081d33">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;z-index:10;background:#081d33;color:#fff;padding:10px 14px}.brand{font-size:20px;font-weight:900}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:#fff;color:#0d3b66}.wrap{max-width:1050px;margin:auto;padding:14px}.intro,.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px}.intro{padding:14px;margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:220px;padding:10px 12px;border:1px solid #ccd5df;border-radius:9px}.pill{border:0;border-radius:999px;padding:8px 11px;font-weight:800;background:#fff;cursor:pointer}.pill.on{background:#0d3b66;color:#fff}.count{font-size:12px;color:#64748b;margin:4px 0 12px}.list{display:grid;gap:10px}.card{padding:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:900;color:#0d3b66}.meta{font-size:12px;color:#64748b;margin-top:4px}.status{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#fef3c7;color:#92400e}.status.ok{background:#dcfce7;color:#166534}.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.ck{display:flex;gap:7px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:8px;font-size:12px}.note{width:100%;margin-top:10px;border:1px solid #ccd5df;border-radius:9px;padding:10px;min-height:58px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:#0d3b66;color:#fff}.soft{background:#eef3f8;color:#173a67}.btn:disabled{opacity:.55}.msg{font-size:12px;font-weight:800;margin-top:8px}.good{color:#166534}.bad{color:#991b1b}.empty{background:#fff;border-radius:14px;padding:30px;text-align:center;color:#64748b}@media(max-width:760px){.checks{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{font-size:17px}}@media(max-width:420px){.checks{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav">
<a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a class="active" href="allergens.html">⚠️ Allergeni</a><a href="promos.html">🏷️ Promo</a><a href="marketing.html">📣 Marketing</a><a href="photos.html">📷 Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a>
</div></header>
<main class="wrap">
<div class="intro"><b>Allergeni menu</b><br><span class="meta">Compila solo informazioni verificate. Un prodotto NON VERIFICATO non viene mostrato al pubblico come “senza allergeni”.</span></div>
<div class="toolbar"><input id="q" class="search" placeholder="Cerca prodotto…"><button class="pill on" data-f="all">Tutti</button><button class="pill" data-f="pending">Da verificare</button><button class="pill" data-f="done">Verificati</button></div>
<div id="count" class="count"></div><div id="list" class="list"><div class="empty">Caricamento…</div></div>
</main>
<script>
const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL'),$=id=>document.getElementById(id),tok=()=>localStorage.getItem('argo_admin_token_v1');
const ALL=[
['gluten','Glutine'],['crustaceans','Crostacei'],['eggs','Uova'],['fish','Pesce'],['peanuts','Arachidi'],['soy','Soia'],['milk','Latte'],['nuts','Frutta a guscio'],['celery','Sedano'],['mustard','Senape'],['sesame','Sesamo'],['sulphites','Solfiti'],['lupin','Lupini'],['molluscs','Molluschi']
];
let rows=[],filter='all',busy=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function valid(){if(!tok()){location.href='./';return false}const {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data){localStorage.removeItem('argo_admin_token_v1');location.href='./';return false}return true}
function checkedSet(r){return new Set(Array.isArray(r.allergens)?r.allergens:[])}
function render(){const q=$('q').value.trim().toLowerCase();const a=rows.filter(r=>(filter==='all'||filter==='pending'&&!r.allergens_reviewed_at||filter==='done'&&r.allergens_reviewed_at)&&(!q||String(r.name).toLowerCase().includes(q)));$('count').textContent=a.length+' prodotti';$('list').innerHTML=a.length?a.map(r=>{const set=checkedSet(r),dis=busy.has(r.id)?' disabled':'';return `<section class="card" id="c-${r.id}"><div class="head"><div><div class="name">${esc(r.name)}</div><div class="meta">${r.active?'Attivo':'Non attivo'} · €${Number(r.price||0).toFixed(2)}</div></div><span class="status ${r.allergens_reviewed_at?'ok':''}">${r.allergens_reviewed_at?'VERIFICATO':'NON VERIFICATO'}</span></div><div class="checks">${ALL.map(([k,l])=>`<label class="ck"><input type="checkbox" value="${k}" ${set.has(k)?'checked':''}${dis}> ${l}</label>`).join('')}</div><textarea class="note" placeholder="Nota facoltativa: es. possibile contaminazione crociata…"${dis}>${esc(r.allergens_note||'')}</textarea><div class="actions"><button class="btn primary" data-save="${r.id}"${dis}>SALVA COME VERIFICATO</button><button class="btn soft" data-reset="${r.id}"${dis}>SEGNA DA RIVERIFICARE</button></div><div class="msg" id="m-${r.id}"></div></section>`}).join(''):'<div class="empty">Nessun prodotto</div>'}
async function save(id,reviewed){if(busy.has(id))return;const c=$('c-'+id);if(!c)return;const allergens=reviewed?[...c.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value):null,note=c.querySelector('textarea').value.trim();busy.add(id);render();const {data,error}=await sb.rpc('argo_admin_update_item_allergens',{p_token:tok(),p_id:id,p_allergens:allergens,p_note:note||null,p_mark_reviewed:reviewed});busy.delete(id);if(error){render();const m=$('m-'+id);if(m){m.className='msg bad';m.textContent='Errore: '+error.message}return}await load();const m=$('m-'+id);if(m){m.className='msg good';m.textContent=data?'Salvato':'Prodotto non trovato'}}
async function load(){const {data,error}=await sb.rpc('argo_admin_menu',{p_token:tok()});if(error){$('list').innerHTML='<div class="empty">Errore caricamento menu</div>';return}rows=data||[];render()}
$('list').addEventListener('click',e=>{const s=e.target.closest('[data-save]');if(s)return void save(s.dataset.save,true);const r=e.target.closest('[data-reset]');if(r)return void save(r.dataset.reset,false)});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()});$('q').oninput=render;
(async()=>{if(await valid())await load()})();
</script></body></html>
