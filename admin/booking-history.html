<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Storico Prenotazioni</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:#fff;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:14px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{padding:10px 12px;border:1px solid #ccd5df;border-radius:9px;background:#fff}.tools input{flex:1;min-width:220px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;margin-bottom:10px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.name{font-weight:900}.meta{font-size:12px;color:#64748b;margin-top:4px}.change{margin-top:8px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:#e5e7eb}.new{background:#fef3c7;color:#92400e}.confirmed{background:#dbeafe;color:#164e9b}.completed{background:#dcfce7;color:#166534}.cancelled{background:#fee2e2;color:#991b1b}.empty,.err{text-align:center;padding:40px;color:#64748b}.err{color:#991b1b}@media(max-width:600px){.brand{font-size:17px}}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="marketing.html">📣 Marketing</a><a href="photos.html">📷 Foto</a><a href="photo-review.html">✅ Verifica Foto</a><a href="photo-shoot-plan.html">📋 Piano Foto</a><a href="bookings.html">📅 Prenotazioni</a><a href="booking-history.html">🕘 Storico Prenotazioni</a><a href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><h2>Storico prenotazioni</h2><div class="tools"><input id="q" placeholder="Cerca nome, admin o stato"><select id="status"><option value="all">Tutti gli stati</option><option value="new">Nuove</option><option value="confirmed">Confermate</option><option value="completed">Completate</option><option value="cancelled">Annullate</option></select></div><div id="list"><div class="empty">Caricamento…</div></div></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');const $=id=>document.getElementById(id);let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=v=>v?new Date(v+'T00:00:00').toLocaleDateString('it-IT'):'';const fmtTime=v=>v?String(v).slice(0,5):'';function pill(s){return `<span class="pill ${esc(s)}">${esc(String(s||'').toUpperCase())}</span>`}async function boot(){if(!tok()){location.href='./';return}const {data:ok}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!ok){localStorage.removeItem('argo_admin_token_v1');location.href='./';return}const {data,error}=await sb.rpc('argo_admin_booking_history',{p_token:tok(),p_booking_id:null});if(error){$('list').innerHTML='<div class="err">Errore: '+esc(error.message)+'</div>';return}rows=data||[];render()}function render(){const s=$('q').value.trim().toLowerCase(),st=$('status').value;const a=rows.filter(x=>(st==='all'||x.new_status===st)&&(!s||[x.booking_name,x.admin_email,x.old_status,x.new_status,x.action].some(v=>String(v||'').toLowerCase().includes(s))));$('list').innerHTML=a.length?a.map(x=>`<div class="card"><div class="head"><div><div class="name">${esc(x.booking_name||'Prenotazione')}</div><div class="meta">${fmtDate(x.booking_date)} ${fmtTime(x.booking_time)}${x.guests!=null?' · '+Number(x.guests)+' persone':''}</div></div><div class="meta">${new Date(x.created_at).toLocaleString('it-IT')}</div></div><div class="change">${pill(x.old_status||'—')} → ${pill(x.new_status||'—')}</div><div class="meta">Azione: ${esc(x.action||'status_change')} · Admin: ${esc(x.admin_email||'—')}</div></div>`).join(''):'<div class="empty">Nessun evento trovato</div>'}$('q').addEventListener('input',render);$('status').addEventListener('change',render);boot()</script></body></html>
