ent('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const VAPID_PUBLIC_KEY='BJe_rFaMYxQo4X8MPQy56UcmFrpznoGzcdMFTUEbYGHz4Cpx4yriV4oa2bNJ3ucw9s56K_mMRCtZEJr47cjCM1U';const $=id=>document.getElementById(id);let all=[],filter='open',lastNew='',audioCtx=null,soundEnabled=localStorage.getItem('argo_sound_v1')==='1',loading=false,lastLoaded=0,busy=new Set();const tok=()=>localStorage.getItem('argo_admin_token_v1'),euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',','),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!tok())location.replace('./');function authFail(){localStorage.removeItem('argo_admin_token_v1');location.replace('./')}function setNotice(text,type='info'){const n=$('notifNotice');n.textContent=text;n.className='notice show '+type}function unlockSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundEnabled=true;localStorage.setItem('argo_sound_v1','1');$('soundBtn').textContent='🔊 SUONO ATTIVO'}catch(e){$('soundBtn').textContent='SUONO NON DISPONIBILE'}}function beep(freq=880,dur=.22,delay=0){if(!soundEnabled||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.03)}function alarm(){beep(980,.28,0);beep(1250,.28,.38);beep(980,.28,.76);beep(1250,.35,1.14)}function notify(o){$('bell').style.display='block';$('bell').classList.add('alarm');setTimeout(()=>{$('bell').style.display='none';$('bell').classList.remove('alarm')},8000);try{navigator.vibrate&&navigator.vibrate([500,180,500,180,800])}catch(e){}alarm();if('Notification'in window&&Notification.permission==='granted')try{new Notification('ARGO · Nuovo ordine',{body:'#'+o.order_number+' · '+o.customer_name+' · '+euro(o.total),tag:'argo-order-'+o.id,renotify:true})}catch(e){}}function b64ToUint8(s){const pad='='.repeat((4-s.length%4)%4),base=(s+pad).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}async function refreshPushState(){const b=$('pushBtn');b.classList.remove('on','blocked');b.disabled=false;if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){b.textContent='PUSH NON SUPPORTATO';b.disabled=true;return}if(Notification.permission==='denied'){b.textContent='🔕 NOTIFICHE BLOCCATE';b.classList.add('blocked');setNotice('Notifiche browser bloccate. Il suono ordini resta indipendente.','warn');return}if(Notification.permission==='default'){b.textContent='📲 ATTIVA NOTIFICHE';return}try{const reg=await navigator.serviceWorker.register('./sw.js');const sub=await reg.pushManager.getSubscription();if(sub){b.textContent='✅ NOTIFICHE ATTIVE';b.classList.add('on')}else b.textContent='📲 ATTIVA NOTIFICHE'}catch(e){b.textContent='📲 ATTIVA NOTIFICHE'}}async function enablePush(){try{if(Notification.permission==='denied'){refreshPushState();return}let perm=Notification.permission;if(perm==='default')perm=await Notification.requestPermission();if(perm!=='granted'){refreshPushState();return}const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8(VAPID_PUBLIC_KEY)});const j=sub.toJSON(),r=await sb.rpc('argo_admin_push_subscribe',{p_token:tok(),p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_user_agent:navigator.userAgent});if(r.error)throw r.error;refreshPushState();setNotice('Notifiche ARGO attive su questo dispositivo.','ok')}catch(e){setNotice('Attivazione notifiche non riuscita. Gli ordini continuano a funzionare.','warn')}}function ageMin(o){return Math.max(0,Math.floor((Date.now()-new Date(o.created_at).getTime())/60000))}function ageClass(o){const m=ageMin(o);return m>=30?'late':m>=20?'warn':''}function orderType(o){const v=String(o.order_type||'pickup').toLowerCase();return /deliver|consegna/.test(v)?'CONSEGNA':'RITIRO DAL LOCALE'}function requested(o){return o.requested_at?new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}async function load(first=false){if(loading)return;loading=true;try{const {data,error}=await sb.rpc('argo_admin_orders',{p_token:tok()});if(error){if(/token|auth|session|unauthorized/i.test(String(error.message)))return authFail();throw error}const rows=data||[],newest=rows.find(x=>x.status==='new');if(!first&&newest&&newest.id!==lastNew)notify(newest);lastNew=newest?.id||'';all=rows;lastLoaded=Date.now();renderStats();render()}catch(e){console.error(e);if(!all.length)$('orders').innerHTML='<div class="loaderr">Impossibile caricare gli ordini. Riprovo automaticamente.</div>'}finally{loading=false}}function localDay(d){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Rome'}).format(new Date(d))}function renderStats(){const today=localDay(new Date()),todayOrders=all.filter(o=>localDay(o.created_at)===today&&o.status!=='cancelled');$('sNew').textContent=all.filter(o=>o.status==='new').length;$('sOpen').textContent=all.filter(o=>['accepted','preparing'].includes(o.status)).length;$('sReady').textContent=all.filter(o=>o.status==='ready').length;$('sLate').textContent=all.filter(o=>!['completed','cancelled'].includes(o.status)&&ageMin(o)>=30).length;$('sSales').textContent=euro(todayOrders.reduce((s,o)=>s+Number(o.total||0),0))}function modifierNames(i){let a=[];if(Array.isArray(i.modifiers))a.push(...i.modifiers.map(x=>typeof x==='string'?x:(x?.name||x?.label||x?.option_name||'')));return [...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))]}function modifierText(i){return modifierNames(i).join(', ')}function itemDetails(i){const mods=modifierNames(i),seen=new Set(mods.map(x=>x.toLocaleLowerCase('it-IT'))),notes=String(i.notes||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).filter(x=>!seen.has(x.toLocaleLowerCase('it-IT'))),parts=[];if(mods.length)parts.push(mods.join(', '));if(notes.length)parts.push(notes.join('\n'));return parts.join('\n')}function nextAction(o){if(o.status==='new')return['accept_print','✓ ACCETTA & STAMPA','print'];if(o.status==='accepted')return['preparing','IN PREPARAZIONE','primary'];if(o.status==='preparing')return['ready','✓ PRONTO','green'];if(o.status==='ready')return['completed','CONSEGNATO','green'];return null}function render(){const x=all.filter(o=>filter==='all'||(filter==='open'?!['completed','cancelled'].includes(o.status):o.status===filter));const rank={new:0,accepted:1,preparing:2,ready:3,completed:4,cancelled:5};x.sort((a,b)=>(rank[a.status]??9)-(rank[b.status]??9)||new Date(a.created_at)-new Date(b.created_at));$('orders').innerHTML=x.length?x.map(card).join(''):'<div class="empty">Nessun ordine</div>'}function card(o){const t=new Date(o.created_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),m=ageMin(o),ac=ageClass(o),next=nextAction(o),disabled=busy.has(o.id)?' disabled':'';return `<article class="order ${o.status==='new'?'new ':''}${ac==='late'&&!['completed','cancelled'].includes(o.status)?'late':''}"><div class="head"><span class="num">#${o.order_number}</span><span><span class="pill">${esc(String(o.status||'').toUpperCase())} · ${t}</span>${!['completed','cancelled'].includes(o.status)?`<span class="age ${ac}">${m} min</span>`:''}</span></div><div class="body"><div class="customer">${esc(o.customer_name)} · ${esc(o.phone)}</div><div class="meta">${orderType(o)}${requested(o)?' · richiesto '+requested(o):''}${o.address?' · '+esc(o.address):''}</div>${(o.items||[]).map(i=>{const d=itemDetails(i);return `<div class="line"><div class="lineMain"><b>${i.quantity}× ${esc(i.name)}</b>${d?`<div class="lineMods">${esc(d)}</div>`:''}</div><span>${euro(i.line_total)}</span></div>`}).join('')}${Number(o.discount_amount)>0?`<div class="line discount"><span>Sconto ${esc(o.promo_code||'')}</span><span>- ${euro(o.discount_amount)}</span></div>`:''}${o.notes?`<p><b>NOTE:</b> ${esc(o.notes)}</p>`:''}<div class="total">${euro(o.total)}</div></div><div class="actions">${next?`<button class="btn ${next[2]} main"${disabled} onclick="act('${o.id}','${next[0]}')">${next[1]}</button>`:''}${o.status!=='new'&&!['completed','cancelled'].includes(o.status)?`<button class="btn primary secondary"${disabled} onclick="act('${o.id}','reprint')">🖨 RISTAMPA</button>`:''}</div></article>`}async function act(id,a){if(busy.has(id))return;busy.add(id);render();const o=all.find(x=>x.id===id);const {error}=await sb.rpc('argo_admin_order_action',{p_token:tok(),p_order_id:id,p_action:a});if(error){busy.delete(id);render();alert('Errore: '+error.message);return}if(a==='accept_print'||a==='reprint')printOrder(o);await load(true);busy.delete(id);render()}function printOrder(o){$('ticket').innerHTML=`<div style="text-align:center;font-weight:bold;font-size:18px">ARGO GREEK COMFORT FOOD</div><div style="text-align:center">*** ORDINE SITO ***</div><hr><div style="font-size:20px;font-weight:bold">#${o.order_number} · ${orderType(o)}</div><div>${new Date(o.created_at).toLocaleString('it-IT')}</div>${requested(o)?`<div><b>RICHIESTO: ${requested(o)}</b></div>`:''}${o.address?`<div>${esc(o.address)}</div>`:''}<hr><b>${esc(o.customer_name)}</b><br>${esc(o.phone)}<hr>${(o.items||[]).map(i=>{const d=itemDetails(i);return `<div style="font-size:15px;margin:7px 0"><b>${i.quantity} x ${esc(i.name)}</b>${d?'<br>'+esc(d).replace(/\n/g,'<br>'):''}</div>`}).join('')}<hr>${o.notes?'<div><b>NOTE: '+esc(o.notes)+'</b></div><hr>':''}${Number(o.discount_amount)>0?`<div>SUBTOTALE ${euro(o.subtotal)}</div><div><b>SCONTO ${esc(o.promo_code||'')}: - ${euro(o.discount_amount)}</b></div>`:''}<div style="font-size:18px;font-weight:bold">TOTALE ${euro(o.total)}</div><div>Pagamento: ${esc(o.payment_method||'')}</div><br><div style="text-align:center">--- ARGO SITO WEB ---</div>`;window.print()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});$('pushBtn').onclick=enablePush;$('soundBtn').onclick=unlockSound;if(soundEnabled)$('soundBtn').textContent='🔊 SUONO ATTIVO';document.addEventListener('pointerdown',()=>{if(soundEnabled&&!audioCtx)unlockSound()},{once:true});function tick(){$('clock').textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('fresh').textContent=lastLoaded?'agg. '+Math.floor((Date.now()-lastLoaded)/1000)+'s fa':'';if(all.length){renderStats();render()}}tick();setInterval(tick,5000);load(true);setTimeout(refreshPushState,250);setInterval(()=>load(false),5000)</script></body></html>
