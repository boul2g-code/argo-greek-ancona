<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin · Ordini</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;z-index:10;background:#081d33;color:#fff;padding:10px 14px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:20px;font-weight:900}.clock{font-weight:800}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a,.nav button{white-space:nowrap;text-decoration:none;border:0;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .sound{background:#f59e0b;color:#10263b}.wrap{padding:12px;max-width:1100px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:11px}.stat{background:#fff;border-radius:13px;padding:13px;border:1px solid #dbe2e8}.stat b{display:block;font-size:25px;color:#0d3b66}.stat span{font-size:11px;color:#64748b;font-weight:800;text-transform:uppercase}.statusbar{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.filter{border:0;border-radius:18px;padding:9px 12px;background:#fff;font-weight:800}.filter.on{background:#0d3b66;color:#fff}.orders{display:grid;grid-template-columns:1fr;gap:10px}.order{background:#fff;border:1px solid #dbe2e8;border-radius:14px;overflow:hidden}.order.new{border:3px solid #f59e0b}.head{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8fafc}.new .head{background:#fff7df}.num{font-size:22px;font-weight:900}.pill{font-size:11px;font-weight:900;padding:5px 9px;border-radius:12px;background:#dbeafe;color:#164e9b}.body{padding:12px}.customer{font-weight:900}.meta{font-size:12px;color:#617080;margin:4px 0 10px}.eta{margin:8px 0;padding:9px 10px;border-radius:9px;background:#eff6ff;color:#1e3a8a;font-size:13px;font-weight:900}.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.discount{color:#15803d;font-weight:800}.total{font-size:20px;font-weight:900;text-align:right;padding-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 12px}.btn{border:0;border-radius:9px;padding:12px 13px;font-weight:900}.primary{background:#0d3b66;color:#fff}.print{background:#f59e0b;color:#10263b}.green{background:#dcfce7;color:#166534}.empty{text-align:center;padding:50px;color:#758393;background:#fff;border-radius:14px}.bell{display:none;position:fixed;right:14px;bottom:14px;z-index:99;background:#f59e0b;color:#111;padding:15px 18px;border-radius:18px;font-weight:900;box-shadow:0 10px 35px #0005}.alarm{animation:pulse .7s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}@media(min-width:760px){.orders{grid-template-columns:1fr 1fr}}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.brand{font-size:17px}.stat b{font-size:22px}}@media print{body *{visibility:hidden}#ticket,#ticket *{visibility:visible}#ticket{position:absolute;left:0;top:0;width:72mm;color:#000;background:#fff;font-family:monospace;font-size:12px}}</style></head><body><div class="top"><div class="toprow"><div class="brand">🍽️ ARGO ADMIN</div><div id="clock" class="clock"></div></div><div class="nav"><button id="soundBtn" class="sound">🔔 ATTIVA SUONO</button><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a href="../" target="_blank">🌐 Sito</a></div></div><main class="wrap"><section class="stats"><div class="stat"><b id="sNew">0</b><span>Nuovi</span></div><div class="stat"><b id="sOpen">0</b><span>In lavorazione</span></div><div class="stat"><b id="sReady">0</b><span>Pronti</span></div><div class="stat"><b id="sSales">€ 0</b><span>Vendite oggi</span></div></section><div class="statusbar"><button class="filter on" data-f="open">Aperti</button><button class="filter" data-f="new">Nuovi</button><button class="filter" data-f="accepted">Accettati</button><button class="filter" data-f="preparing">Preparazione</button><button class="filter" data-f="ready">Pronti</button><button class="filter" data-f="all">Tutti</button></div><div id="orders" class="orders"></div></main><div id="bell" class="bell">🔔 NUOVO ORDINE</div><div id="ticket"></div><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');let all=[],filter='open',lastNew='',audioCtx=null,soundEnabled=localStorage.getItem('argo_sound_v1')==='1';const tok=()=>localStorage.getItem('argo_admin_token_v1'),euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',','),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function valid(){let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data)location.href='./'}function unlockSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundEnabled=true;localStorage.setItem('argo_sound_v1','1');soundBtn.textContent='🔊 SUONO ATTIVO';if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){soundBtn.textContent='SUONO NON DISPONIBILE'}}function beep(freq=880,dur=.22,delay=0){if(!soundEnabled||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.03)}function alarm(){beep(980,.28,0);beep(1250,.28,.38);beep(980,.28,.76);beep(1250,.35,1.14)}function notify(o){bell.style.display='block';bell.classList.add('alarm');setTimeout(()=>{bell.style.display='none';bell.classList.remove('alarm')},8000);try{navigator.vibrate&&navigator.vibrate([500,180,500,180,800])}catch(e){}alarm();if('Notification'in window&&Notification.permission==='granted')try{new Notification('ARGO · Nuovo ordine',{body:'#'+o.order_number+' · '+o.customer_name+' · '+euro(o.total),tag:'argo-order-'+o.id,renotify:true})}catch(e){}}async function load(first=false){let {data,error}=await sb.rpc('argo_admin_orders',{p_token:tok()});if(error)return;const rows=data||[],newest=rows.find(x=>x.status==='new');if(!first&&newest&&newest.id!==lastNew)notify(newest);lastNew=newest?.id||'';all=rows;renderStats();render()}function localDay(d){return new Date(d).toLocaleDateString('sv-SE')}function renderStats(){const today=localDay(new Date()),todayOrders=all.filter(o=>localDay(o.created_at)===today&&o.status!=='cancelled');sNew.textContent=all.filter(o=>o.status==='new').length;sOpen.textContent=all.filter(o=>['accepted','preparing'].includes(o.status)).length;sReady.textContent=all.filter(o=>o.status==='ready').length;sSales.textContent=euro(todayOrders.reduce((s,o)=>s+Number(o.total||0),0))}function eta(o){let base=new Date(o.created_at).getTime()+30*60000;if(o.requested_at)base=Math.max(base,new Date(o.requested_at).getTime());return new Date(base).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}function render(){let x=all.filter(o=>filter==='all'||(filter==='open'?!['completed','cancelled'].includes(o.status):o.status===filter));orders.innerHTML=x.length?x.map(card).join(''):'<div class="empty">Nessun ordine</div>'}function card(o){let t=new Date(o.created_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return `<article class="order ${o.status==='new'?'new':''}"><div class="head"><span class="num">#${o.order_number}</span><span class="pill">${esc(o.status.toUpperCase())} · ${t}</span></div><div class="body"><div class="customer">${esc(o.customer_name)} · ${esc(o.phone)}</div><div class="meta">RITIRO DAL LOCALE${o.requested_at?' · richiesto '+new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}</div>${!['completed','cancelled'].includes(o.status)?`<div class="eta">⏱️ Tempo standard 30 min · previsto ${eta(o)}</div>`:''}${(o.items||[]).map(i=>`<div class="line"><b>${i.quantity}× ${esc(i.name)}</b><span>${euro(i.line_total)}</span></div>`).join('')}${Number(o.discount_amount)>0?`<div class="line discount"><span>Sconto ${esc(o.promo_code||'')}</span><span>- ${euro(o.discount_amount)}</span></div>`:''}${o.notes?`<p><b>NOTE:</b> ${esc(o.notes)}</p>`:''}<div class="total">${euro(o.total)}</div></div><div class="actions">${o.status==='new'?`<button class="btn print" onclick="act('${o.id}','accept_print')">✓ ACCETTA & STAMPA</button>`:`<button class="btn primary" onclick="act('${o.id}','reprint')">🖨 RISTAMPA</button>`}${o.status==='accepted'?`<button class="btn primary" onclick="act('${o.id}','preparing')">IN PREPARAZIONE</button>`:''}${['accepted','preparing'].includes(o.status)?`<button class="btn green" onclick="act('${o.id}','ready')">✓ PRONTO</button>`:''}${o.status==='ready'?`<button class="btn green" onclick="act('${o.id}','completed')">CONSEGNATO</button>`:''}</div></article>`}async function act(id,a){let o=all.find(x=>x.id===id);let {error}=await sb.rpc('argo_admin_order_action',{p_token:tok(),p_order_id:id,p_action:a});if(error){alert('Errore: '+error.message);return}if(a==='accept_print'||a==='reprint')printOrder(o);await load(true)}function printOrder(o){ticket.innerHTML=`<div style="text-align:center;font-weight:bold;font-size:18px">ARGO GREEK COMFORT FOOD</div><div style="text-align:center">*** ORDINE SITO ***</div><hr><div style="font-size:20px;font-weight:bold">#${o.order_number} · RITIRO</div><div>${new Date(o.created_at).toLocaleString('it-IT')}</div><div><b>PREVISTO: ${eta(o)}</b></div><hr><b>${esc(o.customer_name)}</b><br>${esc(o.phone)}<hr>${(o.items||[]).map(i=>`<div style="font-size:15px;margin:7px 0"><b>${i.quantity} x ${esc(i.name)}</b>${i.notes?'<br>'+esc(i.notes):''}</div>`).join('')}<hr>${o.notes?'<div><b>NOTE: '+esc(o.notes)+'</b></div><hr>':''}${Number(o.discount_amount)>0?`<div>SUBTOTALE ${euro(o.subtotal)}</div><div><b>SCONTO ${esc(o.promo_code||'')}: - ${euro(o.discount_amount)}</b></div>`:''}<div style="font-size:18px;font-weight:bold">TOTALE ${euro(o.total)}</div><div>Pagamento: ${esc(o.payment_method)}</div><br><div style="text-align:center">--- ARGO SITO WEB ---</div>`;window.print()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});soundBtn.onclick=unlockSound;if(soundEnabled)soundBtn.textContent='🔊 SUONO ATTIVO';document.addEventListener('pointerdown',()=>{if(soundEnabled&&!audioCtx)unlockSound()},{once:true});setInterval(()=>clock.textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),1000);valid().then(()=>load(true));setInterval(()=>load(false),5000)</script></body></html>
