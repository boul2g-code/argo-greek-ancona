<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Ordini</title><meta name="theme-color" content="#081d33"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;z-index:5;background:#081d33;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.back{color:#fff;text-decoration:none}.wrap{padding:12px;max-width:1050px;margin:auto}.statusbar{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.filter{border:0;border-radius:18px;padding:8px 12px;background:#fff}.filter.on{background:#0d3b66;color:#fff}.order{background:#fff;border:1px solid #dbe2e8;border-radius:14px;margin-bottom:10px;overflow:hidden}.order.new{border:3px solid #f59e0b}.head{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8fafc}.new .head{background:#fff7df}.num{font-size:21px;font-weight:900}.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:12px;background:#dbeafe;color:#164e9b}.body{padding:12px}.customer{font-weight:800}.meta{font-size:12px;color:#617080;margin:4px 0 10px}.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}.discount{color:#15803d;font-weight:800}.total{font-size:19px;font-weight:900;text-align:right;padding-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 12px}.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:900}.primary{background:#0d3b66;color:#fff}.print{background:#f59e0b;color:#10263b}.green{background:#dcfce7;color:#166534}.empty{text-align:center;padding:50px;color:#758393}.bell{display:none;position:fixed;right:16px;bottom:16px;background:#f59e0b;color:#111;padding:12px 16px;border-radius:20px;font-weight:900}@media(min-width:760px){.orders{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order{margin:0}}@media print{body *{visibility:hidden}#ticket,#ticket *{visibility:visible}#ticket{position:absolute;left:0;top:0;width:72mm;color:#000;background:#fff;font-family:monospace;font-size:12px}.no-print{display:none!important}}</style></head><body><div class="top"><a class="back" href="./">← Admin</a><h1>🍽️ ARGO ORDINI</h1><span id="clock"></span></div><div class="wrap"><div class="statusbar"><button class="filter on" data-f="open">Aperti</button><button class="filter" data-f="new">Nuovi</button><button class="filter" data-f="accepted">Accettati</button><button class="filter" data-f="ready">Pronti</button><button class="filter" data-f="all">Tutti</button><a href="promos.html" class="filter" style="text-decoration:none">🏷️ Codici promo</a></div><div id="orders" class="orders"></div></div><div id="bell" class="bell">🔔 NUOVO ORDINE</div><div id="ticket"></div><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');let all=[],filter='open',lastNew='';const tok=()=>localStorage.getItem('argo_admin_token_v1'),euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',',');async function valid(){let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data)location.href='./'}async function load(first=false){let {data,error}=await sb.rpc('argo_admin_orders',{p_token:tok()});if(error)return;let newest=(data||[]).find(x=>x.status==='new');if(!first&&newest&&newest.id!==lastNew){notify()}lastNew=newest?.id||'';all=data||[];render()}function notify(){bell.style.display='block';setTimeout(()=>bell.style.display='none',5000);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}function render(){let x=all.filter(o=>filter==='all'||(filter==='open'?!['completed','cancelled'].includes(o.status):o.status===filter));orders.innerHTML=x.length?x.map(card).join(''):'<div class="empty">Nessun ordine</div>'}function card(o){let t=new Date(o.created_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return `<article class="order ${o.status==='new'?'new':''}"><div class="head"><span class="num">#${o.order_number}</span><span class="pill">${o.status.toUpperCase()} · ${t}</span></div><div class="body"><div class="customer">${esc(o.customer_name)} · ${esc(o.phone)}</div><div class="meta">${o.order_type.toUpperCase()}${o.requested_at?' · richiesto '+new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}${o.address?' · '+esc(o.address):''}</div>${o.items.map(i=>`<div class="line"><b>${i.quantity}× ${esc(i.name)}</b><span>${euro(i.line_total)}</span></div>`).join('')}${Number(o.discount_amount)>0?`<div class="line discount"><span>Sconto ${esc(o.promo_code||'')}</span><span>- ${euro(o.discount_amount)}</span></div>`:''}${o.notes?`<p><b>NOTE:</b> ${esc(o.notes)}</p>`:''}<div class="total">${euro(o.total)}</div></div><div class="actions">${o.status==='new'?`<button class="btn print" onclick="act('${o.id}','accept_print')">✓ ACCETTA & STAMPA</button>`:`<button class="btn primary" onclick="act('${o.id}','reprint')">🖨 RISTAMPA</button>`}${o.status==='accepted'?`<button class="btn primary" onclick="act('${o.id}','preparing')">IN PREPARAZIONE</button>`:''}${['accepted','preparing'].includes(o.status)?`<button class="btn green" onclick="act('${o.id}','ready')">PRONTO</button>`:''}${o.status==='ready'?`<button class="btn green" onclick="act('${o.id}','completed')">CONSEGNATO</button>`:''}</div></article>`}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function act(id,a){let o=all.find(x=>x.id===id);let {error}=await sb.rpc('argo_admin_order_action',{p_token:tok(),p_order_id:id,p_action:a});if(error){alert('Errore: '+error.message);return}if(a==='accept_print'||a==='reprint')printOrder(o);await load(true)}function printOrder(o){ticket.innerHTML=`<div style="text-align:center;font-weight:bold;font-size:18px">ARGO GREEK COMFORT FOOD</div><div style="text-align:center">*** ORDINE SITO ***</div><hr><div style="font-size:20px;font-weight:bold">#${o.order_number} · ${o.order_type.toUpperCase()}</div><div>${new Date(o.created_at).toLocaleString('it-IT')}</div><hr><b>${esc(o.customer_name)}</b><br>${esc(o.phone)}${o.requested_at?'<br>ORA: '+new Date(o.requested_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}${o.address?'<br>'+esc(o.address):''}<hr>${o.items.map(i=>`<div style="font-size:15px;margin:7px 0"><b>${i.quantity} x ${esc(i.name)}</b>${i.notes?'<br>'+esc(i.notes):''}</div>`).join('')}<hr>${o.notes?'<div><b>NOTE: '+esc(o.notes)+'</b></div><hr>':''}${Number(o.discount_amount)>0?`<div>SUBTOTALE ${euro(o.subtotal)}</div><div><b>SCONTO ${esc(o.promo_code||'')}: - ${euro(o.discount_amount)}</b></div>`:''}<div style="font-size:18px;font-weight:bold">TOTALE ${euro(o.total)}</div><div>Pagamento: ${esc(o.payment_method)}</div><br><div style="text-align:center">--- ARGO SITO WEB ---</div>`;window.print()}document.querySelectorAll('.filter[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})},1000);valid().then(()=>load(true));setInterval(()=>load(false),5000)</script></body></html>
