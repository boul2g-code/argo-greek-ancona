<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARGO Admin · Crop Foto</title><meta name="theme-color" content="#173a67"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{background:#081d33;color:#fff;padding:12px 15px}.top a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:15px;margin-bottom:12px}.hint{font-size:13px;color:#64748b;line-height:1.5}.stage{background:#111827;border-radius:12px;overflow:hidden;touch-action:none;margin-top:12px}.stage canvas{width:100%;height:auto;display:block;cursor:grab}.stage canvas.drag{cursor:grabbing}.tools{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:14px}.tools label{font-size:12px;font-weight:900}.tools input{width:100%;margin-top:8px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer;background:#173a67;color:#fff}.btn:disabled{opacity:.55;cursor:wait}.soft{background:#e8eef6;color:#173a67;text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{font-weight:800;font-size:13px;margin-top:10px}.ok{color:#166534}.bad{color:#991b1b}@media(max-width:620px){.tools{grid-template-columns:1fr}.wrap{padding:9px}}
</style></head><body><header class="top"><a href="photo-review.html">← VERIFICA FOTO</a></header><main class="wrap"><div class="card"><h2 id="title">Crop foto menu</h2><div class="hint">Trascina la foto per centrare il prodotto e usa lo zoom. Il risultato è sempre 3:2, 1200×800. Il file originale resta intatto e il salvataggio non pubblica automaticamente la foto.</div><div class="stage"><canvas id="canvas" width="1200" height="800"></canvas></div><div class="tools"><label>ZOOM<input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label><button class="btn soft" id="reset">RICENTRA</button></div><div class="actions"><button class="btn" id="save">SALVA CROP 1200×800</button><a class="btn soft" href="photo-review.html">ANNULLA</a></div><div id="msg" class="msg"></div></div></main><script>
const SB='https://zibubwrntdmdxyimqddo.supabase.co',KEY='sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL',PREVIEW=SB+'/functions/v1/argo-photo-preview',SAVE=SB+'/functions/v1/argo-photo-derivative';
const sb=supabase.createClient(SB,KEY),mediaId=new URLSearchParams(location.search).get('media')||'',token=localStorage.getItem('argo_admin_token_v1')||'',canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),zoom=document.getElementById('zoom'),msg=document.getElementById('msg');let img=null,base=1,panX=0,panY=0,drag=null;
function clamp(){if(!img)return;const s=base*Number(zoom.value),w=img.naturalWidth*s,h=img.naturalHeight*s;panX=Math.min((w-1200)/2,Math.max(-(w-1200)/2,panX));panY=Math.min((h-800)/2,Math.max(-(h-800)/2,panY))}
function draw(){if(!img)return;clamp();const s=base*Number(zoom.value),w=img.naturalWidth*s,h=img.naturalHeight*s,x=(1200-w)/2+panX,y=(800-h)/2+panY;ctx.fillStyle='#111827';ctx.fillRect(0,0,1200,800);ctx.drawImage(img,x,y,w,h)}
function reset(){zoom.value='1';panX=panY=0;draw()}
async function boot(){if(!token||!/^[0-9a-f-]{36}$/i.test(mediaId)){location.href='./';return}const {data:ok}=await sb.rpc('argo_admin_valid',{p_token:token});if(!ok){location.href='./';return}const {data,error}=await sb.rpc('argo_admin_media',{p_token:token});const row=(data||[]).find(x=>x.id===mediaId);if(error||!row||!row.preview_storage_path){msg.className='msg bad';msg.textContent='Originale privato non disponibile.';return}document.getElementById('title').textContent='Crop · '+(row.title||row.source_filename);const r=await fetch(PREVIEW,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({admin_token:token,media_id:mediaId})});if(!r.ok){msg.className='msg bad';msg.textContent='Impossibile caricare la foto.';return}const url=URL.createObjectURL(await r.blob());img=new Image();img.onload=()=>{base=Math.max(1200/img.naturalWidth,800/img.naturalHeight);reset();URL.revokeObjectURL(url)};img.src=url}
zoom.oninput=draw;document.getElementById('reset').onclick=reset;canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY};canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag')};canvas.onpointermove=e=>{if(!drag)return;const k=1200/canvas.getBoundingClientRect().width;panX=drag.px+(e.clientX-drag.x)*k;panY=drag.py+(e.clientY-drag.y)*k;draw()};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;canvas.classList.remove('drag')};document.getElementById('save').onclick=()=>{if(!img)return;const b=document.getElementById('save');b.disabled=true;msg.className='msg';msg.textContent='Salvataggio…';canvas.toBlob(async blob=>{try{const form=new FormData();form.append('admin_token',token);form.append('media_id',mediaId);form.append('file',blob,'menu-1200x800.jpg');const r=await fetch(SAVE,{method:'POST',headers:{apikey:KEY},body:form});const j=await r.json();if(!r.ok)throw new Error(j.error||'Errore salvataggio');msg.className='msg ok';msg.textContent='Crop salvato e verificato. Ora puoi tornare alla verifica e decidere se pubblicarlo.';setTimeout(()=>location.href='photo-review.html?media='+encodeURIComponent(mediaId),1400)}catch(e){msg.className='msg bad';msg.textContent=e.message;b.disabled=false}},'image/jpeg',.9)};boot();
</script></body></html>
