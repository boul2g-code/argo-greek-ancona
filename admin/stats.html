<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGO Admin · Statistiche</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17263a}.top{position:sticky;top:0;background:#081d33;color:white;padding:10px 14px;z-index:10}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;overflow:auto;padding-top:9px}.nav a{white-space:nowrap;text-decoration:none;border-radius:18px;padding:8px 11px;background:#173b60;color:#fff;font-weight:800;font-size:12px}.nav .active{background:white;color:#0d3b66}.wrap{max-width:1000px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:16px}.val{font-size:28px;font-weight:900;color:#0d3b66}.lab{font-size:12px;color:#64748b;font-weight:800;text-transform:uppercase}.section{margin-top:14px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="top"><div class="brand">🍽️ ARGO ADMIN</div><div class="nav"><a href="orders.html">🧾 Ordini</a><a href="menu.html">🍽️ Menu</a><a href="promos.html">🏷️ Promo</a><a href="photos.html">📷 Foto</a><a href="bookings.html">📅 Prenotazioni</a><a class="active" href="stats.html">📊 Statistiche</a><a href="settings.html">⚙️ Impostazioni</a></div></div><main class="wrap"><div class="grid"><div class="card"><div id="orders" class="val">0</div><div class="lab">Ordini oggi</div></div><div class="card"><div id="sales" class="val">€ 0</div><div class="lab">Vendite oggi</div></div><div class="card"><div id="avg" class="val">€ 0</div><div class="lab">Scontrino medio</div></div><div class="card"><div id="open" class="val">0</div><div class="lab">Ordini aperti</div></div></div><div class="section card"><h3>Ultimi ordini</h3><div id="recent"></div></div></main><script>const sb=supabase.createClient('https://zibubwrntdmdxyimqddo.supabase.co','sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL');const tok=()=>localStorage.getItem('argo_admin_token_v1');const euro=n=>'€ '+Number(n||0).toFixed(2).replace('.',',');const day=d=>new Date(d).toLocaleDateString('sv-SE');async function valid(){let {data}=await sb.rpc('argo_admin_valid',{p_token:tok()});if(!data)location.href='./'}async function load(){let {data}=await sb.rpc('argo_admin_orders',{p_token:tok()});let a=data||[],t=day(new Date()),today=a.filter(x=>day(x.created_at)===t&&x.status!=='cancelled'),sum=today.reduce((s,x)=>s+Number(x.total||0),0);orders.textContent=today.length;sales.textContent=euro(sum);avg.textContent=euro(today.length?sum/today.length:0);open.textContent=a.filter(x=>!['completed','cancelled'].includes(x.status)).length;recent.innerHTML=a.slice(0,10).map(x=>`<div class="row"><span>#${x.order_number} · ${x.customer_name}</span><b>${euro(x.total)}</b></div>`).join('')||'<div>Nessun ordine</div>'}valid().then(load)</script></body></html>
