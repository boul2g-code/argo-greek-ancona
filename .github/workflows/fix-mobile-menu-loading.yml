name: Fix ARGO Mobile Menu Loading
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-menu-loading.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu loading and compact error state
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function loadMenu(){
  const SUPA='https://zibubwrntdmdxyimqddo.supabase.co';
  const KEY='sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL';
  const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
  try{
    const [cr,mr]=await Promise.all([
      fetch(SUPA+'/rest/v1/argo_menu_categories?select=id,name&active=eq.true&order=sort_order.asc',{headers:H}),
      fetch(SUPA+'/rest/v1/argo_menu_items?select=id,category_id,name,description,price,image_url,sort_order&active=eq.true&order=sort_order.asc',{headers:H})
    ]);
    if(!cr.ok||!mr.ok)throw new Error('menu_http');
    const cats=await cr.json(),rows=await mr.json(),catMap=Object.fromEntries(cats.map(c=>[c.id,c.name]));
    menuData=rows.map((x,idx)=>({id:idx+1,sourceId:x.id,name:x.name,description:x.description||'',price:Number(x.price||0),image:x.image_url||'',category:catMap[x.category_id]||'Altro',available:true}));
    renderFilters();renderMenu();
  }catch(e){
    console.error(e);
    document.getElementById('menu-grid').innerHTML='<p style=\"color:rgba(255,255,255,.45);padding:40px;text-align:center;grid-column:1/-1\">Menu temporaneamente non disponibile. Usa ARGO Direct per vedere il menu aggiornato.</p>';
  }
}"""
          new="""async function loadMenu(){
  const SUPA='https://zibubwrntdmdxyimqddo.supabase.co';
  const KEY='sb_publishable_IGXGYoh2jg1ardyg9jW3vg_DTybVlOL';
  const grid=document.getElementById('menu-grid');
  const cacheKey='argo_home_menu_cache_v1';
  try{
    const cached=localStorage.getItem(cacheKey);
    if(cached){
      const parsed=JSON.parse(cached);
      if(Array.isArray(parsed)&&parsed.length){menuData=parsed;renderFilters();renderMenu();}
    }
  }catch(_){ }
  const request=async(headers)=>{
    const [cr,mr]=await Promise.all([
      fetch(SUPA+'/rest/v1/argo_menu_categories?select=id,name&active=eq.true&order=sort_order.asc',{headers,cache:'no-store'}),
      fetch(SUPA+'/rest/v1/argo_menu_items?select=id,category_id,name,description,price,image_url,sort_order&active=eq.true&order=sort_order.asc',{headers,cache:'no-store'})
    ]);
    if(!cr.ok||!mr.ok)throw new Error('menu_http_'+cr.status+'_'+mr.status);
    return [await cr.json(),await mr.json()];
  };
  try{
    let cats,rows;
    try{[cats,rows]=await request({'apikey':KEY});}
    catch(first){[cats,rows]=await request({'apikey':KEY,'Authorization':'Bearer '+KEY});}
    const catMap=Object.fromEntries(cats.map(c=>[c.id,c.name]));
    menuData=rows.map((x,idx)=>({id:idx+1,sourceId:x.id,name:x.name,description:x.description||'',price:Number(x.price||0),image:x.image_url||'',category:catMap[x.category_id]||'Altro',available:true}));
    try{localStorage.setItem(cacheKey,JSON.stringify(menuData));}catch(_){ }
    renderFilters();renderMenu();
  }catch(e){
    console.error('ARGO menu load failed',e);
    if(menuData.length){renderFilters();renderMenu();return;}
    document.getElementById('menu-filters').innerHTML='';
    grid.innerHTML='<div class=\"menu-error\"><strong>Menu online</strong>La lista non si è caricata in questa pagina. Apri ARGO Direct: trovi subito il menu aggiornato, prezzi e ritiro dal locale.<a href=\"ordina/\">VEDI IL MENU E ORDINA →</a></div>';
  }
}"""
          if old not in s:
              raise SystemExit('Target loadMenu block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "argo-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix mobile menu loading and fallback"
          git push
