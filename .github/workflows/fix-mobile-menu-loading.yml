name: Fix ARGO Mobile Menu Loading
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage menu resilience
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker="  const H={'apikey':KEY,'Authorization':'Bearer '+KEY};\n"
          cache="""  const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
  const cacheKey='argo_home_menu_cache_v1';
  try{
    const cached=localStorage.getItem(cacheKey);
    if(cached){
      const parsed=JSON.parse(cached);
      if(Array.isArray(parsed)&&parsed.length){menuData=parsed;renderFilters();renderMenu();}
    }
  }catch(_){ }
"""
          if marker not in s: raise SystemExit('menu header marker missing')
          s=s.replace(marker,cache,1)
          marker2="    renderFilters();renderMenu();\n  }catch(e){"
          repl2="""    try{localStorage.setItem(cacheKey,JSON.stringify(menuData));}catch(_){ }
    renderFilters();renderMenu();
  }catch(e){"""
          if marker2 not in s: raise SystemExit('menu success marker missing')
          s=s.replace(marker2,repl2,1)
          old="    console.error(e);\n    document.getElementById('menu-grid').innerHTML='<p style=\"color:rgba(255,255,255,.45);padding:40px;text-align:center;grid-column:1/-1\">Menu temporaneamente non disponibile. Usa ARGO Direct per vedere il menu aggiornato.</p>';"
          new="""    console.error(e);
    if(menuData.length){renderFilters();renderMenu();return;}
    document.getElementById('menu-filters').innerHTML='';
    document.getElementById('menu-grid').innerHTML='<div class=\"menu-error\"><strong>Menu online</strong>Il menu non si è caricato qui. Apri ARGO Direct per menu aggiornato, prezzi e ritiro dal locale.<a href=\"ordina/\">VEDI IL MENU E ORDINA →</a></div>';"""
          if old not in s: raise SystemExit('menu error marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name argo-site-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git diff --cached --check
          git commit -m "Improve mobile menu fallback and cache"
          git push
