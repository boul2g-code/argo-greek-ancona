name: Apply ARGO Direct fallback
on:
  push:
    paths:
      - '.github/workflows/apply-ordina-fallback.yml'
      - 'scripts/patch_ordina_fallback.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_ordina_fallback.py
      - run: |
          git config user.name "argo-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ordina/index.html
          git diff --cached --check
          git commit -m "Add ARGO Direct offline fallback" || exit 0
          git push
