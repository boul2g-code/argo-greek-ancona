name: Fix ARGO photo admin progressive loading
on:
  push:
    paths:
      - '.github/workflows/fix-photo-admin-progressive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch progressive loading
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin/photos.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let rows=[],filter='all';","let rows=[],filter='all',visibleLimit=36;",1)
          s=s.replace(".count{font-size:12px;color:#667;margin:4px 0 14px}",".count{font-size:12px;color:#667;margin:4px 0 14px}.morewrap{text-align:center;padding:18px 0}.morebtn{border:0;background:#173a67;color:#fff;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}",1)
          old="function render(){const x=rows.filter(r=>matchesFilter(r,filter));document.getElementById('count').textContent=x.length+' foto';document.getElementById('grid').innerHTML=x.map(r=>`<article class=\"card\"><div class=\"pic\"><img src=\"${esc(r.thumb_url)}\" data-drive-id=\"${esc(r.source_drive_id||'')}\" data-fallback=\"0\" alt=\"${esc(r.title)}\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\" onerror=\"imgFallback(this)\"><span class=\"badge ${esc(r.status)}\">${statusLabel(r)}</span></div><div class=\"body\"><div class=\"title\">${esc(r.title)}</div><div class=\"meta\">${esc(r.source_filename||'')} · ${esc(r.category||'')}</div><div class=\"for\">Uso consigliato: ${esc(r.recommended_for||'—')}</div>${r.linked_menu_item_name?`<div class=\"meta\">Collegata a: <b>${esc(r.linked_menu_item_name)}</b></div>`:''}<div class=\"note\">${esc(r.notes||'')}</div><div class=\"actions\"><a class=\"open\" href=\"${esc(r.source_url)}\" target=\"_blank\" rel=\"noopener\">Apri originale</a><a class=\"copy\" href=\"#\" onclick=\"navigator.clipboard.writeText('${esc(r.source_url)}');return false\">Copia link</a></div></div></article>`).join('')||'<div class=\"empty\">Nessuna foto in questa categoria.</div>'}"
          new="function render(){const x=rows.filter(r=>matchesFilter(r,filter));const shown=x.slice(0,visibleLimit);document.getElementById('count').textContent=Math.min(visibleLimit,x.length)+' / '+x.length+' foto';document.getElementById('grid').innerHTML=shown.map(r=>`<article class=\"card\"><div class=\"pic\"><img src=\"${esc(r.thumb_url)}\" data-drive-id=\"${esc(r.source_drive_id||'')}\" data-fallback=\"0\" alt=\"${esc(r.title)}\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\" onerror=\"imgFallback(this)\"><span class=\"badge ${esc(r.status)}\">${statusLabel(r)}</span></div><div class=\"body\"><div class=\"title\">${esc(r.title)}</div><div class=\"meta\">${esc(r.source_filename||'')} · ${esc(r.category||'')}</div><div class=\"for\">Uso consigliato: ${esc(r.recommended_for||'—')}</div>${r.linked_menu_item_name?`<div class=\"meta\">Collegata a: <b>${esc(r.linked_menu_item_name)}</b></div>`:''}<div class=\"note\">${esc(r.notes||'')}</div><div class=\"actions\"><a class=\"open\" href=\"${esc(r.source_url)}\" target=\"_blank\" rel=\"noopener\">Apri originale</a><a class=\"copy\" href=\"#\" onclick=\"navigator.clipboard.writeText('${esc(r.source_url)}');return false\">Copia link</a></div></div></article>`).join('')||'<div class=\"empty\">Nessuna foto in questa categoria.</div>';if(x.length>shown.length)document.getElementById('grid').insertAdjacentHTML('afterend','<div id=\"morewrap\" class=\"morewrap\"><button class=\"morebtn\" onclick=\"visibleLimit+=36;document.getElementById(\\\'morewrap\\\')?.remove();render()\">Carica altre foto</button></div>')}"
          if old not in s:
            raise SystemExit('render marker not found')
          s=s.replace(old,new,1)
          s=s.replace("filter=b.dataset.filter;render()","filter=b.dataset.filter;visibleLimit=36;document.getElementById('morewrap')?.remove();render()",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "argo-photo-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-photo-admin-progressive.yml
          git add admin/photos.html
          git diff --cached --check
          git commit -m "fix(admin): progressively load photo library"
          git push
