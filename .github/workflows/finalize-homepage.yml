name: Finalize ARGO Homepage
on:
  push:
    paths:
      - '.github/workflows/finalize-homepage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage menu fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="document.getElementById('menu-grid').innerHTML='<p style=\"color:rgba(255,255,255,.45);padding:40px;text-align:center;grid-column:1/-1\">Menu temporaneamente non disponibile. Usa ARGO Direct per vedere il menu aggiornato.</p>';"
          new="document.getElementById('menu-filters').innerHTML=''; document.getElementById('menu-grid').innerHTML='<div class=\"menu-error\"><strong>Menu ARGO</strong><span>Il menu live non si è caricato.</span><a href=\"ordina/\">APRI IL MENU AGGIORNATO →</a></div>';"
          s=s.replace(old,new)
          s=s.replace("const H={'apikey':KEY,'Authorization':'Bearer '+KEY};","const H={'apikey':KEY};")
          p.write_text(s,encoding='utf-8')
      - name: Commit homepage
        run: |
          git config user.name "argo-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix homepage mobile menu fallback" || exit 0
          git push
