name: Fix ORDINA ORA links

on:
  push:
    paths:
      - '.github/workflows/fix-order-now-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point all primary order CTAs to ARGO Direct
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '<a href="#ordina" class="nav-cta" data-i18n="nav_order">ORDINA ORA</a>': '<a href="ordina/" class="nav-cta" data-i18n="nav_order">ORDINA ORA</a>',
              '<a href="#ordina" onclick="closeMobileNav()" style="color:var(--sand)" data-i18n="nav_order">ORDINA ORA →</a>': '<a href="ordina/" onclick="closeMobileNav()" style="color:var(--sand)" data-i18n="nav_order">ORDINA ORA →</a>',
              '<a href="#ordina" class="btn-hero-primary" data-i18n="btn_order">⚡ ORDINA ORA</a>': '<a href="ordina/" class="btn-hero-primary" data-i18n="btn_order">⚡ ORDINA ORA</a>',
          }
          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed += 1
          if changed != 3:
              raise SystemExit(f'Expected 3 replacements, made {changed}')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix primary ORDINA ORA links" || exit 0
          git push
