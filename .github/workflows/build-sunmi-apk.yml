name: Build ARGO SUNMI APK
on:
  push:
    paths:
      - 'sunmi-app/**'
      - '.github/workflows/build-sunmi-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: sunmi-app
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: argo-sunmi-apk
          path: sunmi-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
